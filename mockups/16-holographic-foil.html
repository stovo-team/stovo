<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Company Brain — Holographic Foil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #030307; color: #fff; font-family: sans-serif; }
    .holo-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.1);
      position: relative; overflow: hidden;
    }
    .holo-card::before {
      content: ''; position: absolute; inset: -50%;
      background: linear-gradient(45deg, transparent 40%, rgba(236,72,153,0.2) 50%, rgba(59,130,246,0.2) 60%, transparent 70%);
      animation: holo-shimmer 6s infinite; pointer-events: none;
    }
    @keyframes holo-shimmer { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
  </style>
</head>
<body class="p-8 max-w-4xl mx-auto min-h-screen flex flex-col justify-center">
  <div class="holo-card rounded-3xl p-10 border border-pink-500/30">
    <span class="text-xs uppercase tracking-widest text-pink-400 font-bold">Holographic Alpha</span>
    <h1 class="text-5xl font-black mt-2 mb-4 bg-clip-text text-transparent bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-400">Company Brain</h1>
    <div class="text-xs text-amber-300 bg-amber-950/40 border border-amber-500/30 p-3 rounded-xl mb-6">
      Alpha Notice: The Company Brain module and multi-agent systems are currently unavailable.
    </div>
    <div class="flex justify-between items-center border-t border-white/10 pt-6">
      <div>
        <div class="text-xs text-zinc-400">Early Bird Sales Tier</div>
        <div class="text-2xl font-bold">$29/mo <span class="text-xs text-zinc-500 line-through">$75</span></div>
      </div>
      <button class="px-6 py-3 rounded-xl bg-gradient-to-r from-pink-500 to-cyan-500 text-white font-bold text-xs">Unlock Alpha</button>
    </div>
  </div>
</body>
</html>
