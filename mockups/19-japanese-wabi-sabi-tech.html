<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Company Brain — Wabi-Sabi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #141210; color: #c4bfba; font-family: serif; }
    .zen-border { border-color: #2b2825; }
  </style>
</head>
<body class="p-10 max-w-4xl mx-auto min-h-screen flex flex-col justify-between">
  <div class="flex justify-between items-baseline border-b zen-border pb-4 text-xs font-sans">
    <span class="tracking-widest uppercase">Company Brain (知恵)</span>
    <span class="text-amber-600">Early Alpha • Incomplete</span>
  </div>
  <div class="my-auto py-12">
    <h1 class="text-5xl md:text-6xl text-white font-normal mb-6 tracking-tight">Imperfection & Emergence.</h1>
    <p class="text-base text-zinc-400 font-sans max-w-xl mb-8 leading-relaxed">
      In early alpha, our memory graph is still forming. The comprehensive company brain is intentionally unavailable while the foundation cures.
    </p>
    <div class="border zen-border p-6 font-sans max-w-md bg-[#191714]">
      <div class="text-xs text-zinc-500 uppercase tracking-widest mb-1">Alpha Patronage</div>
      <div class="text-2xl text-white mb-4">$15 <span class="text-xs text-zinc-500 line-through font-normal">$40</span></div>
      <button class="px-5 py-2.5 border zen-border hover:bg-white hover:text-black text-xs uppercase tracking-widest transition">
        Enter Alpha
      </button>
    </div>
  </div>
  <div class="border-t zen-border pt-4 text-xs font-sans text-zinc-600">Stovo Knowledge Pavilion.</div>
</body>
</html>
