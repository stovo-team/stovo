<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Company Brain — Command Palette OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0c0d14; color: #fff; font-family: -apple-system, sans-serif; }
    .spotlight {
      background: rgba(22, 24, 38, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body class="p-6 min-h-screen flex items-center justify-center">
  <div class="spotlight rounded-2xl max-w-2xl w-full p-6">
    <div class="flex items-center gap-3 border-b border-white/10 pb-4 mb-4">
      <span class="text-zinc-500">🔍</span>
      <input type="text" value="Company Brain: Check Alpha Status" class="bg-transparent text-sm w-full outline-none text-zinc-200" readonly>
      <span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded">ALPHA</span>
    </div>
    <div class="space-y-2 text-xs mb-6">
      <div class="p-3 rounded-lg bg-white/5 flex justify-between items-center">
        <span>⚠️ Company Brain Central Sync</span>
        <span class="text-rose-400 font-bold">UNAVAILABLE</span>
      </div>
      <div class="p-3 rounded-lg bg-white/5 flex justify-between items-center">
        <span>⚡ Multi-Agent Orchestrator</span>
        <span class="text-rose-400 font-bold">IN DEVELOPMENT</span>
      </div>
      <div class="p-3 rounded-lg bg-indigo-500/20 border border-indigo-500/40 flex justify-between items-center">
        <span>🏷️ Special Alpha Sale Pass</span>
        <span class="text-indigo-300 font-bold">$24/mo (60% OFF)</span>
      </div>
    </div>
    <div class="flex justify-between items-center text-xs text-zinc-500 pt-2 border-t border-white/10">
      <span>Use Arrow Keys to Navigate</span>
      <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-xs">Buy Alpha License</button>
    </div>
  </div>
</body>
</html>
