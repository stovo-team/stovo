<!doctype html>
<html lang="en" data-theme-mode="dark" data-platform="web">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call UI · real component preview</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      /* Only preview framing is local; the call stage, tiles, statuses, buttons,
         icons, and audio settings come from production React components/CSS. */
      body { margin: 0; }
      #root { min-height: 100vh; }
      .call-preview-page { min-height: 100vh; padding: 20px; background: var(--background-primary, #101014); color: var(--text-primary, #f7f7fb); }
      .call-preview-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1040px; margin:0 auto 12px; }
      .call-preview-toolbar-options { display:flex; align-items:center; gap:12px; }
      .call-preview-toolbar-options label { display:flex; align-items:center; gap:7px; color:var(--text-secondary,#aaa); font-size:12px; }
      .call-preview-toolbar-options select { background:var(--surface-raised,#222); color:inherit; border:1px solid var(--border-default,#333); border-radius:8px; padding:7px 8px; }
      .call-preview-toolbar button { border:1px solid var(--border-default, #333); border-radius:8px; background:var(--surface-raised, #222); color:inherit; padding:8px 12px; cursor:pointer; }
      .call-preview-switches { display:flex; gap:8px; flex-wrap:wrap; }
      .call-preview-switches button.active { background:var(--accent-primary, #7258e8); }
      .call-preview-note { max-width:1040px; margin:0 auto 10px; color:var(--text-secondary, #aaa); font-size:12px; }
      .call-preview-panel { display:flex; flex-direction:column; gap:14px; max-width:1040px; min-height:min(700px, calc(100vh - 110px)); margin:0 auto; padding:18px; border:1px solid var(--border-default, #333); border-radius:14px; background:var(--surface-card, #17171d); }
      .call-preview-header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      .call-preview-header-actions { position:relative; display:flex; align-items:center; gap:5px; }
      .call-preview-minimize { display:inline-grid; place-items:center; width:34px; height:34px; padding:0 !important; border-radius:50% !important; }
      .call-preview-more-trigger { background:transparent; color:inherit; border:0; padding:5px; border-radius:8px; display:inline-flex; cursor:pointer; }
      .call-preview-more-menu { position:absolute; right:0; top:calc(100% + 6px); z-index:20; min-width:150px; padding:5px; background:var(--surface-raised,#222); border:1px solid var(--border-default,#333); border-radius:10px; box-shadow:0 12px 32px #0008; }
      .call-preview-more-menu button { width:100%; text-align:left; color:inherit; background:transparent; border:0; border-radius:7px; padding:9px; cursor:pointer; }
      .call-preview-more-menu button:hover { background:var(--surface-hover,#333); }
      .call-preview-header strong { font-size:14px; }
      .call-preview-header span { color:var(--text-secondary, #aaa); font-size:12px; }
      .call-preview-panel .call-popup-video-area { flex:1; min-height:390px; display:flex; align-items:center; justify-content:center; padding:16px; background:transparent; }
      .call-preview-panel .call-grid { max-width:100%; }
      .call-preview-panel .call-ctrl-row { align-items:flex-start; }
      .call-preview-control-rows { display:flex; justify-content:center; align-items:flex-start; }
      .call-preview-control-row { align-items:flex-start; display:flex; justify-content:center; gap:12px; }
      .call-preview-control-row > .guest-device-control { flex:0 0 auto; }
      .call-preview-control-row .call-ctrl-wrap { position:relative; }
      .call-preview-restore { display:block; margin:25px auto; background:var(--surface-raised,#222); color:inherit; border:1px solid var(--border-default,#444); border-radius:999px; padding:12px 18px; cursor:pointer; }
      .call-preview-camera-feed { position:absolute; inset:0; display:grid; place-items:center; background:radial-gradient(ellipse at 55% 30%,#53647a 0,#283242 40%,#10131b 100%); color:#dbeafe; font-size:13px; }
      .call-preview-camera-feed.is-back-camera { transform:scaleX(-1); }
      .call-preview-share-stage { flex:1; min-height:390px; display:grid; grid-template-columns:minmax(0,1fr) 180px; gap:12px; }
      .call-preview-share-content { position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:14px; padding:clamp(20px,5vw,60px); overflow:hidden; border:1px solid #51627a; border-radius:16px; color:#eef4ff; text-align:left; background:radial-gradient(ellipse at 85% 20%,#34465f,#171e2b 55%,#0b1018); }
      .call-preview-share-content > span { color:#60a5fa; font-size:11px; letter-spacing:.16em; }
      .call-preview-share-content strong { font-size:clamp(26px,4vw,48px); }
      .call-preview-share-content small { color:#aab9ce; font-size:15px; }
      .call-preview-share-columns { display:flex; gap:9px; width:100%; margin-top:20px; }
      .call-preview-share-columns i { height:55px; flex:1; border-radius:8px; background:linear-gradient(135deg,#35445a,#202a38); border:1px solid #3b4a60; }
      .call-preview-share-participants { display:flex; flex-direction:column; gap:8px; }
      .call-preview-share-participants > div { display:flex; flex-direction:column; justify-content:flex-end; gap:5px; padding:12px; min-height:90px; border-radius:12px; background:#090b10; border:1px solid #292f39; font-size:12px; }
      .call-preview-share-participants span { color:#aab0bc; font-size:11px; }
      .call-preview-fullscreen-backdrop { position:fixed; inset:0; z-index:5000; display:grid; place-items:center; padding:20px; background:#050609ed; }
      .call-preview-fullscreen { position:relative; width:min(1200px,100%); height:min(88vh,800px); display:grid; place-items:center; border:1px solid #354052; border-radius:14px; background:#111722; }
      .call-preview-fullscreen > button { position:absolute; right:14px; top:14px; display:grid; place-items:center; width:40px; height:40px; border:1px solid #465166; border-radius:50%; background:#232b37; color:white; cursor:pointer; }
      .call-preview-fullscreen-content { width:80%; height:72%; display:grid; place-items:center; border-radius:10px; background:linear-gradient(135deg,#2e4058,#161e29); color:#eaf1ff; font-size:clamp(22px,4vw,48px); }
      .call-preview-settings-anchor { position:relative; }
      .call-preview-settings-anchor > span { display:none; }
      .call-preview-more-anchor { position:relative; }
      .call-preview-mobile-menu { position:absolute; left:0; right:auto; bottom:calc(100% + 12px); z-index:50; display:grid; gap:3px; width:min(336px,calc(100vw - 32px)); max-width:min(336px,calc(100vw - 32px)); min-width:min(212px,calc(100vw - 32px)); padding:7px; border:1px solid color-mix(in srgb,var(--border-default) 75%,transparent); border-radius:16px; background:color-mix(in oklab,var(--surface-raised) 92%,#101827); box-shadow:0 12px 32px #0008; backdrop-filter:blur(20px); }
      .call-preview-mobile-menu button { display:flex; align-items:center; gap:11px; min-height:44px; padding:0 12px; border:0; border-radius:10px; background:transparent; color:var(--text-primary,#fff); text-align:left; }
      .call-preview-mobile-menu button:hover,.call-preview-mobile-menu button:focus-visible { background:color-mix(in srgb,var(--accent-primary) 18%,transparent); outline:0; }
      .call-preview-intelligence { position:absolute; z-index:60; bottom:150px; left:50%; transform:translateX(-50%); width:min(320px,90vw); padding:18px; border:1px solid var(--border-default,#333); border-radius:18px; background:var(--surface-raised,#222); box-shadow:0 12px 32px #0008; }
      .call-preview-intelligence > button { float:right; padding:5px !important; border-radius:50% !important; }
      .call-preview-control-rows.is-hidden { opacity:0; pointer-events:none; }
      .call-preview-landscape-toggle { position:absolute; right:12px; top:12px; z-index:3; width:40px; height:40px; display:grid; place-items:center; border:1px solid #465166; border-radius:50%; color:#fff; background:#292d34; }
      .call-preview-panel.is-landscape-mobile { position:fixed; inset:auto auto auto 100vw; width:100dvh; height:100vw; transform:rotate(90deg); transform-origin:top left; z-index:10000; overflow:hidden; }
      .call-preview-panel.is-landscape-mobile .call-preview-share-stage { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr); min-height:0; }
      .call-preview-panel.is-landscape-mobile .call-preview-header,.call-preview-panel.is-landscape-mobile .call-preview-control-rows { position:relative; z-index:3; }
      .call-preview-panel.is-landscape-mobile .call-preview-share-content { min-height:0; }
      .call-preview-panel.is-landscape-mobile .call-preview-mobile-menu { width:min(336px,calc(100dvh - 32px)); max-width:min(336px,calc(100dvh - 32px)); }
      .call-preview-control-rows { flex-wrap:nowrap; }
      .call-preview-focus-stage { flex:1; min-height:390px; display:grid; grid-template-columns:minmax(0,1fr) minmax(120px,22%); grid-template-rows:minmax(0,1fr) auto; gap:10px; padding:8px; background:#05070b; border-radius:14px; }
      .call-preview-focus-header { gap:8px; }
      .call-preview-focus-header [aria-label="Back to participants"],.call-preview-focus-header [aria-label="Minimize call"] { display:grid; place-items:center; width:36px; height:36px; border:1px solid var(--border-default,#444); border-radius:999px; background:var(--surface-raised,#222); color:inherit; padding:0; cursor:pointer; }
      .call-preview-focus-main { position:relative; min-height:0; overflow:hidden; display:grid; place-items:center; align-content:center; gap:12px; border-radius:14px; background:linear-gradient(145deg,#1a2633,#090c12 68%); color:#fff; }
      .call-preview-focus-main .call-preview-camera-feed { position:absolute; inset:0; }
      .call-preview-focus-main > strong,.call-preview-focus-main > span { position:relative; z-index:2; }
      .call-preview-focus-avatar { width:96px; height:96px; display:grid; place-items:center; border-radius:50%; color:#fff; font-size:34px; background:linear-gradient(140deg,#3d5876,#172131); }
      .call-preview-focus-participants { display:grid; grid-auto-rows:min-content; align-content:start; gap:8px; overflow:auto; }
      .call-preview-focus-participant { position:relative; width:100%; min-height:0; overflow:hidden; display:grid; place-items:center; border:1px solid #343b48; border-radius:10px; color:#fff; background:linear-gradient(140deg,#3d5876,#172131); }
      .call-preview-focus-participant > span { font-size:25px; }
      .call-preview-focus-participant > strong { position:absolute; left:6px; right:6px; bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; text-align:left; }
      .call-preview-focus-close { grid-column:1 / -1; justify-self:center; min-height:38px; padding:0 16px; border:1px solid #465166; border-radius:999px; color:#fff; background:#232b37; cursor:pointer; }
      .call-preview-panel { position:relative; }
      .call-preview-mobile-stage { position:relative; flex:1; min-height:460px; overflow:hidden; border-radius:12px; background:#030406; }
      .call-preview-stage-primary { position:absolute; inset:0; display:grid; align-content:center; justify-items:center; gap:12px; width:100%; border:0; border-radius:0; background:linear-gradient(145deg,#1a2633,#090c12 68%); color:#fff; }
      .call-preview-stage-primary > strong,.call-preview-stage-primary > span { position:relative; z-index:2; }
      .call-preview-remote-avatar { width:96px !important; height:96px !important; border-radius:50% !important; }
      .call-preview-stage-pip-wrap { position:absolute; right:12px; bottom:18px; z-index:20; width:104px; height:140px; overflow:hidden; border:2px solid rgba(255,255,255,.35); border-radius:9px; background:#090b10; box-shadow:0 4px 18px #0008; }
      .call-preview-stage-pip { position:absolute; inset:0; width:100%; height:100%; padding:0 !important; overflow:hidden; border:0 !important; border-radius:0 !important; background:transparent !important; cursor:pointer; }
      .call-preview-stage-pip .call-preview-camera-feed,.call-preview-stage-pip .call-preview-avatar { width:100%; height:100%; }
      .call-preview-stage-pip-wrap .call-ctrl-btn.call-preview-flip { position:absolute; top:6px; right:6px; z-index:3; width:32px; height:32px; padding:0; border-radius:50%; background:#0009; }
      .call-preview-mobile .call-preview-control-rows { align-items:center; gap:10px; border-radius:999px; }
      .call-preview-mobile .call-preview-control-row { align-items:flex-start; flex-wrap:nowrap; gap:12px; }
      .call-preview-mobile .call-preview-control-row:first-child { justify-content:center; }
      .call-preview-mobile .call-preview-control-row:last-child { justify-content:center; }
      .call-preview-mobile .call-preview-control-row:first-child .call-ctrl-btn { width:54px; height:54px; }
      .call-preview-mobile .call-preview-control-row:last-child .call-ctrl-btn { width:48px; height:48px; }
      .call-preview-legacy-action { display:none !important; }
      .call-preview-share-participants > .call-preview-share-participant { position:relative; flex:0 0 1fr; min-height:0; width:100%; overflow:hidden; justify-content:flex-end; }
      .call-preview-share-participant strong,.call-preview-share-participant span { position:relative; z-index:2; }
      .call-preview-share-participant .call-preview-avatar { position:absolute; inset:0; width:100%; height:100%; display:grid; place-items:center; font-size:32px; color:#fff; background:linear-gradient(140deg,#3d5876,#172131); }
      .call-preview-share-participant .call-preview-camera-feed { position:absolute; inset:0; }
      .call-preview-mobile .call-preview-panel { max-width:430px; min-height:calc(100vh - 110px); border-radius:24px; }
      .call-preview-mobile .call-preview-panel .call-popup-video-area { min-height:460px; }
      .call-preview-mobile .call-preview-panel .call-grid { grid-template-columns:1fr !important; }
      .call-preview-mobile .call-preview-panel .call-grid__tile { min-height:160px; }
      .call-preview-mobile .call-preview-panel .call-ctrl-row { gap:10px; }
      .call-preview-mobile .call-preview-control-rows { flex-direction:row; flex-wrap:nowrap; width:100%; overflow:visible; gap:4px; }
      .call-preview-mobile .call-preview-control-row { display:grid; grid-template-columns:repeat(5,48px); width:100%; flex:1 1 auto; gap:0; justify-content:space-between; }
      .call-preview-mobile .call-preview-control-row:first-child { justify-content:space-between; }
      .call-preview-mobile .call-preview-control-row:last-child { justify-content:space-between; }
      .call-preview-mobile .call-preview-control-row > .call-ctrl-wrap { min-width:48px; }
      .call-preview-mobile .call-preview-more-anchor > span { position:absolute; top:50px; left:50%; transform:translateX(-50%); white-space:nowrap; }
      .call-preview-mobile .call-preview-control-row .call-ctrl-btn { width:48px !important; height:48px !important; min-width:48px; min-height:48px; border-radius:50%; }
      .call-preview-mobile .call-preview-focus-stage { min-height:360px; grid-template-columns:minmax(0,1fr) minmax(76px,25%); gap:6px; padding:4px; }
      .call-preview-mobile .call-preview-focus-participant { font-size:10px; }
      .call-preview-mobile .call-preview-share-stage { grid-template-columns:1fr; grid-template-rows:minmax(260px,1fr) auto; }
      .call-preview-mobile .call-preview-share-participants { flex-direction:row; overflow-x:auto; }
      .call-preview-mobile .call-preview-share-participants > div { flex:0 0 105px; min-width:105px; min-height:0; }
      .call-preview-mobile .call-preview-panel .guest-device-select { display:none; }
      .call-preview-mobile .call-preview-panel .call-audio-popup-backdrop { position:fixed; z-index:3000; }
      @media (max-width:600px) { .call-preview-page { padding:10px; } .call-preview-toolbar { align-items:flex-start; flex-direction:column; } .call-preview-toolbar-options { width:100%; justify-content:space-between; } .call-preview-panel { padding:12px; } .call-preview-panel .call-popup-video-area { min-height:360px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/call-ui-preview.tsx"></script>
  </body>
</html>
