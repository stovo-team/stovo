server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Vite filenames are content-hashed. Never send the SPA shell for a
    # missing asset: browsers otherwise report a misleading MIME error after
    # a deployment when an old cached shell requests a retired bundle.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PDF.js ships its worker as an ES module. The base nginx MIME table on
    # some image variants does not include `.mjs`, which makes it fall back to
    # application/octet-stream and causes browsers to reject the worker.
    location ~ ^/assets/.*\.mjs$ {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Keep the entry document fresh so it always references the assets that
    # were deployed together with it.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
