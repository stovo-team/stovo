name: Documentation and deployment validation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'deploy/charts/stovo/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/docs-validation.test.mjs'
      - '.github/workflows/docs-validation.yml'
      - 'deploy/compose/**'
      - '.env.example'
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'deploy/charts/stovo/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/docs-validation.test.mjs'
      - '.github/workflows/docs-validation.yml'
      - 'deploy/compose/**'
      - '.env.example'

jobs:
  docs-and-deployment:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '["ubuntu-latest"]' || '["self-hosted","Windows","tests"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Detect available shell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        if: runner.os == 'Linux'
        with:
          version: v3.18.4
      - name: Install Helm on Windows runner
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v3.18.4'
          $archive = Join-Path $env:RUNNER_TEMP "helm-$version-windows-amd64.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "helm-$version-windows-amd64"
          $helmPath = Join-Path $extractPath 'windows-amd64\helm.exe'
          $helmBin = Join-Path $env:RUNNER_TEMP 'helm-bin'

          Invoke-WebRequest -Uri "https://get.helm.sh/helm-$version-windows-amd64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extractPath -Force
          New-Item -ItemType Directory -Path $helmBin -Force | Out-Null
          Copy-Item -LiteralPath $helmPath -Destination (Join-Path $helmBin 'helm.exe') -Force
          Add-Content -Path $env:GITHUB_PATH -Value $helmBin
          & (Join-Path $helmBin 'helm.exe') version --short
      - name: Install kubeconform on Windows runner
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v0.6.7'
          $archive = Join-Path $env:RUNNER_TEMP "kubeconform-$version-windows-amd64.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "kubeconform-$version-windows-amd64"
          $kubeconformBin = Join-Path $env:RUNNER_TEMP 'kubeconform-bin'

          Invoke-WebRequest -Uri "https://github.com/yannh/kubeconform/releases/download/$version/kubeconform-windows-amd64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extractPath -Force
          New-Item -ItemType Directory -Path $kubeconformBin -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $extractPath 'kubeconform.exe') -Destination (Join-Path $kubeconformBin 'kubeconform.exe') -Force
          Add-Content -Path $env:GITHUB_PATH -Value $kubeconformBin
          & (Join-Path $kubeconformBin 'kubeconform.exe') -v
      - name: Install kubeconform on Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=v0.6.7
          archive="$RUNNER_TEMP/kubeconform-$version-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/kubeconform-bin"
          curl --fail --location --retry 3 \
            "https://github.com/yannh/kubeconform/releases/download/$version/kubeconform-linux-amd64.tar.gz" \
            --output "$archive"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" kubeconform
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/kubeconform" -v
      - name: Ensure Docker Compose CLI plugin is available
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $composeConfigDir = Join-Path $env:RUNNER_TEMP 'docker-config'
          $composeDir = Join-Path $composeConfigDir 'cli-plugins'
          New-Item -ItemType Directory -Path $composeDir -Force | Out-Null
          $composePath = Join-Path $composeDir 'docker-compose.exe'
          Invoke-WebRequest -Uri 'https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-windows-x86_64.exe' -OutFile $composePath
          $env:DOCKER_CONFIG = $composeConfigDir
          Add-Content -Path $env:GITHUB_ENV -Value "DOCKER_CONFIG=$composeConfigDir"
          $composeVersion = & docker.exe compose version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose CLI plugin could not start: $composeVersion"
          }
          $composeVersion
      - name: Ensure Docker Compose CLI plugin is available on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose version
            exit 0
          fi

          compose_dir="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$compose_dir"
          curl --fail --location --retry 3 \
            https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 \
            --output "$compose_dir/docker-compose"
          chmod +x "$compose_dir/docker-compose"
          docker compose version
      - name: Validate docs, Compose, and Helm chart
        run: node --test .github/docs-validation.test.mjs
      - name: Validate rendered Helm manifests against Kubernetes 1.30 schemas
        shell: bash
        run: |
          set -o pipefail
          validator=kubeconform
          if [ "$RUNNER_OS" = 'Windows' ]; then validator=kubeconform.exe; fi
          helm template stovo deploy/charts/stovo \
            --set backend.image.repository=registry.example.test/stovo/backend \
            --set backend.image.tag=v1.2.3 \
            --set frontend.image.repository=registry.example.test/stovo/frontend \
            --set frontend.image.tag=v1.2.3 \
            | "$validator" -strict -summary -kubernetes-version 1.30.0 -
          helm template stovo deploy/charts/stovo \
            --set app.domain=chat.example.test \
            --set backend.image.repository=registry.example.test/stovo/backend \
            --set backend.image.tag=release-42 \
            --set frontend.image.repository=registry.example.test/stovo/frontend \
            --set frontend.image.tag=release-42 \
            --set backend.resources.requests.memory=768Mi \
            --set uploads.persistence.size=37Gi \
            --set service.backend.port=18000 \
            --set existingSecret=stovo-test-secret \
            | "$validator" -strict -summary -kubernetes-version 1.30.0 -
