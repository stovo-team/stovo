name: Documentation and deployment validation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'deploy/charts/stovo/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/docs-validation.test.mjs'
      - '.github/workflows/docs-validation.yml'
      - 'deploy/compose/**'
      - '.env.example'
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'deploy/charts/stovo/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/docs-validation.test.mjs'
      - '.github/workflows/docs-validation.yml'
      - 'deploy/compose/**'
      - '.env.example'

jobs:
  docs-and-deployment:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || '["self-hosted","Linux","tests"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.18.4
      - name: Ensure Docker Compose CLI plugin is available
        shell: bash
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose version
            exit 0
          fi

          compose_dir="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$compose_dir"
          curl --fail --location --retry 3 \
            https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 \
            --output "$compose_dir/docker-compose"
          chmod +x "$compose_dir/docker-compose"
          docker compose version
      - name: Validate docs, Compose, and Helm chart
        run: node --test .github/docs-validation.test.mjs
      - name: Validate rendered Helm manifests against Kubernetes 1.30 schemas
        shell: bash
        run: |
          set -o pipefail
          helm template stovo deploy/charts/stovo \
            --set backend.image.repository=registry.example.test/stovo/backend \
            --set backend.image.tag=v1.2.3 \
            --set frontend.image.repository=registry.example.test/stovo/frontend \
            --set frontend.image.tag=v1.2.3 \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.30.0 -
          helm template stovo deploy/charts/stovo \
            --set app.domain=chat.example.test \
            --set backend.image.repository=registry.example.test/stovo/backend \
            --set backend.image.tag=release-42 \
            --set frontend.image.repository=registry.example.test/stovo/frontend \
            --set frontend.image.tag=release-42 \
            --set backend.resources.requests.memory=768Mi \
            --set uploads.persistence.size=37Gi \
            --set service.backend.port=18000 \
            --set existingSecret=stovo-test-secret \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.30.0 -
