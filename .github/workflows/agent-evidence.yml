name: Agent workflow evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Fork and draft PRs use hosted workers. Ready same-repository PRs use the
# online Windows validation runners for both capture and comparison.
permissions:
  contents: read

concurrency:
  group: agent-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && fromJSON('["self-hosted","e2e","Windows"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      visual: ${{ steps.select.outputs.visual }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/agent-workflows-gate.mjs select

  validators:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && fromJSON('["self-hosted","e2e","Windows"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate workflow tools and policy links
        run: |
          node --test scripts/agent-workflows/*.test.mjs e2e/tools/*.test.mjs .github/agent-workflows-ci.test.mjs
          node --test --test-name-pattern='all Markdown local links|documented Compose filenames|agent instructions' .github/docs-validation.test.mjs

  visual:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && fromJSON('["self-hosted","e2e","Windows"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked frontend, harness and Chromium
        shell: bash
        run: |
          npm --prefix frontend ci
          npm --prefix e2e ci
          cd e2e
          for attempt in 1 2 3; do
            if [ "$RUNNER_OS" = "Windows" ]; then
              install_command=(npx playwright install chromium)
            else
              install_command=(npx playwright install --with-deps chromium)
            fi
            if "${install_command[@]}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$attempt"
          done
      - name: Capture all twelve head scenarios and compare approved references
        shell: bash
        env:
          STOVO_VISUAL_COMPARE: 'true'
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ ! -f e2e/visual/__screenshots__/win32/reference-approval.json ]; then
            STOVO_VISUAL_COMPARE=false node e2e/tools/capture-evidence.mjs --task pr-${{ github.event.pull_request.number }} --output artifacts/agent-workflows/ci/head
            echo 'Windows screenshot candidates were captured. A human-reviewed Windows reference approval is required before visual comparison can pass.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          STOVO_VISUAL_COMPARE=true node e2e/tools/capture-evidence.mjs --task pr-${{ github.event.pull_request.number }} --output artifacts/agent-workflows/ci/head
      - name: Capture the common shell matrix at exact base and head
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STOVO_VISUAL_COMPARE: 'false'
        run: node e2e/tools/compare-revisions.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --task pr-${{ github.event.pull_request.number }} --output artifacts/agent-workflows/ci/comparison --grep 'loaded shell'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: evidence
        if: ${{ always() }}
        with:
          name: agent-evidence-${{ github.event.pull_request.head.sha }}
          path: artifacts/agent-workflows/ci/
          if-no-files-found: error
          retention-days: 14
      - name: Link the synthetic evidence artifact
        if: ${{ always() }}
        shell: bash
        env:
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
          COMPARISON_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Source: `%s`\n\nBase: `%s`\n\n[Evidence artifact](%s)\n' "$SOURCE_REVISION" "$COMPARISON_BASE" "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"

# This aggregate covers this workflow only. Backend acceptance and independent
# QA use validate-delivery; repository rules must also require real product CI.
  aggregate:
    name: Agent workflow gate
    if: ${{ always() }}
    needs: [changes, validators, visual]
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && fromJSON('["self-hosted","e2e","Windows"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node .github/agent-workflows-gate.mjs aggregate
