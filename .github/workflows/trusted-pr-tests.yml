name: CI/CD Pipeline

on:
  pull_request_target:
    branches: [master, 'feature/**', 'hotfix/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Windows","tests"]') || fromJSON('["ubuntu-24.04"]') }}
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            frontend:
              - 'frontend/**'
              - 'scripts/check-frontend-css-size.cjs'
              - 'scripts/check-frontend-css-size.test.cjs'
            backend:
              - 'backend/**'
              - 'deploy/migrations/master/**'
              - 'deploy/**'

  pipeline-contract:
    name: Pipeline Contract
    if: github.event.pull_request.draft == false
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Windows","tests"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - name: Configure Git long paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Detect available shell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify pipeline workflow contract
        shell: bash
        run: bash .github/workflows/pipeline.test.sh
  frontend_dependencies:
    name: Prepare frontend dependencies
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.changes.outputs.frontend == 'true' }}
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","e2e"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 20
    outputs:
      os: ${{ steps.versions.outputs.os }}
      arch: ${{ steps.versions.outputs.arch }}
      node: ${{ steps.versions.outputs.node }}
      npm: ${{ steps.versions.outputs.npm }}
      artifact-ready: ${{ steps.upload.outcome == 'success' }}
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Configure Git long paths and workspace
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git config --global core.longpaths true
          if (Test-Path frontend\node_modules) {
            Remove-Item -LiteralPath frontend\node_modules -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) { throw "Git for Windows Bash was not found at '$gitBash'." }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Record dependency runtime
        id: versions
        shell: bash
        run: |
          echo "os=$RUNNER_OS" >> "$GITHUB_OUTPUT"
          echo "arch=$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "npm=$(npm --version)" >> "$GITHUB_OUTPUT"
          rm -f frontend-dependencies.tar
      - name: Restore installed frontend dependencies
        id: dependencies-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frontend-dependencies.tar
          key: frontend-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.node }}-${{ steps.versions.outputs.npm }}-${{ hashFiles('frontend/package.json', 'frontend/package-lock.json', 'frontend/.npmrc', '.npmrc') }}
      - name: Install and package frontend dependencies
        if: steps.dependencies-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          (cd frontend && npm ci)
          tar -cf frontend-dependencies.tar -C frontend node_modules
      - name: Upload frontend dependencies for this run
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dependencies
          path: frontend-dependencies.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  frontend_test_shards:
    name: Frontend CI test shards
    needs: [changes, frontend_dependencies]
    if: >-
      !cancelled() &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","e2e"]') || fromJSON('["ubuntu-24.04"]') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      VITEST_MAX_WORKERS: '2'
    steps:
      - name: Configure Git long paths and workspace
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git config --global core.longpaths true
          if (Test-Path frontend\node_modules) {
            Remove-Item -LiteralPath frontend\node_modules -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download shared frontend dependencies
        if: needs.frontend_dependencies.outputs.artifact-ready == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dependencies
          path: ${{ runner.temp }}/frontend-dependencies-${{ github.run_id }}
      - name: Restore shared frontend dependencies or install locally
        shell: bash
        env:
          PREP_RESULT: ${{ needs.frontend_dependencies.result }}
          ARTIFACT_READY: ${{ needs.frontend_dependencies.outputs.artifact-ready }}
          PREP_OS: ${{ needs.frontend_dependencies.outputs.os }}
          PREP_ARCH: ${{ needs.frontend_dependencies.outputs.arch }}
          PREP_NODE: ${{ needs.frontend_dependencies.outputs.node }}
          PREP_NPM: ${{ needs.frontend_dependencies.outputs.npm }}
        run: |
          set -euo pipefail
          restored=false
          artifact_dir="$RUNNER_TEMP/frontend-dependencies-$GITHUB_RUN_ID"
          if [ "$PREP_RESULT" = success ] && [ "$ARTIFACT_READY" = true ] &&
             [ "$PREP_OS" = "$RUNNER_OS" ] && [ "$PREP_ARCH" = "$RUNNER_ARCH" ] &&
             [ "$PREP_NODE" = "$(node --version)" ] && [ "$PREP_NPM" = "$(npm --version)" ]; then
            if [ -f "$artifact_dir/frontend-dependencies.tar" ] &&
               tar -xf "$artifact_dir/frontend-dependencies.tar" -C frontend; then
              restored=true
            fi
          fi
          if [ "$restored" = true ]; then
            echo "Restored frontend dependencies from this workflow run."
          else
            echo "Shared dependencies unavailable; running npm ci locally."
            unset GH_TOKEN
            (cd frontend && npm ci)
          fi
      - name: CSS size guard
        if: matrix.shard == 1
        shell: bash
        working-directory: frontend
        run: npm run check:css-size
      - name: Test
        shell: bash
        working-directory: frontend
        run: npm test -- --shard=${{ matrix.shard }}/2
      - name: Build
        if: matrix.shard == 1
        shell: bash
        working-directory: frontend
        run: npm run build

  frontend-ci:
    name: Frontend CI
    needs: [changes, frontend_test_shards]
    if: >-
      !cancelled() &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","e2e"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - name: Require successful frontend test shards
        env:
          FRONTEND_SHARD_RESULT: ${{ needs.frontend_test_shards.result }}
        shell: powershell
        run: |
          if ($env:FRONTEND_SHARD_RESULT -ne 'success') {
            throw "Frontend test shards did not succeed: $env:FRONTEND_SHARD_RESULT"
          }
      - name: Aggregate successful frontend shards
        run: echo "All frontend test shards and build passed."

  backend_test_shards:
    name: Backend CI test shards
    needs: changes
    if: >-
      !cancelled() &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.backend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","tests","Windows"]') || fromJSON('["ubuntu-24.04"]') }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Configure Git long paths
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - name: Start Docker Desktop for backend test services
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dockerCli = Get-Command docker.exe -ErrorAction SilentlyContinue
          if (-not $dockerCli) {
            $dockerCliDirectories = @(
              (Join-Path $env:ProgramFiles 'Docker\Docker\resources\bin'),
              (Join-Path $env:LOCALAPPDATA 'Programs\DockerDesktop\resources\bin')
            )
            $dockerCliDirectory = $dockerCliDirectories | Where-Object { Test-Path (Join-Path $_ 'docker.exe') } | Select-Object -First 1
            if (-not $dockerCliDirectory) {
              throw 'Docker CLI was not found. Install Docker Desktop for the Windows runner account.'
            }
            Add-Content -Path $env:GITHUB_PATH -Value $dockerCliDirectory
            $env:PATH = "$dockerCliDirectory;$env:PATH"
          }

          docker desktop start --detach 2>$null | Out-Null
          $desktopStartExitCode = $LASTEXITCODE
          if ($desktopStartExitCode -ne 0) {
            $desktopCandidates = @(
              (Join-Path $env:ProgramFiles 'Docker\Docker\Docker Desktop.exe'),
              (Join-Path $env:LOCALAPPDATA 'Programs\DockerDesktop\Docker Desktop.exe')
            )
            $dockerDesktop = $desktopCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $dockerDesktop) {
              throw 'Docker Desktop was not found. Install it for the Windows runner account.'
            }
            if (-not (Get-Process -Name 'Docker Desktop' -ErrorAction SilentlyContinue)) {
              Start-Process -FilePath $dockerDesktop
            }
          }

          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep -Seconds 3
            $ErrorActionPreference = 'Continue'
            $dockerOs = docker info --format '{{.OSType}}' 2>$null
            $dockerInfoExitCode = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($dockerInfoExitCode -eq 0) { break }
          } while ((Get-Date) -lt $deadline)
          if ($dockerInfoExitCode -ne 0) {
            throw 'Docker Desktop did not start within 3 minutes. Ensure the Windows runner account can access the Docker engine.'
          }

          if ($dockerOs -ne 'linux') {
            docker desktop engine use linux
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not switch Docker Desktop to Linux containers. Update Docker Desktop to a version with the desktop CLI and allow the runner account to switch engines.'
            }
            $deadline = (Get-Date).AddMinutes(3)
            do {
              Start-Sleep -Seconds 3
              $ErrorActionPreference = 'Continue'
              $dockerOs = docker info --format '{{.OSType}}' 2>$null
              $dockerInfoExitCode = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              if ($dockerInfoExitCode -eq 0 -and $dockerOs -eq 'linux') { break }
            } while ((Get-Date) -lt $deadline)
            if ($dockerInfoExitCode -ne 0 -or $dockerOs -ne 'linux') {
              throw 'Docker Desktop did not become ready with its Linux container engine within 3 minutes.'
            }
          }
      - name: Start PostgreSQL and Redis test containers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = "${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}"
          $postgresContainer = "stovo-test-postgres-$suffix"
          $redisContainer = "stovo-test-redis-$suffix"

          docker rm -f -v $postgresContainer $redisContainer 2>$null | Out-Null
          docker run --detach --name $postgresContainer --publish 127.0.0.1::5432 `
            --env POSTGRES_USER=family_user `
            --env POSTGRES_PASSWORD=family_password `
            --env POSTGRES_DB=family_messenger_test `
            --health-cmd 'pg_isready -U family_user -d family_messenger_test' `
            --health-interval 5s --health-timeout 5s --health-retries 10 postgres:16
          if ($LASTEXITCODE -ne 0) { throw 'Failed to start the PostgreSQL test container.' }

          docker run --detach --name $redisContainer --publish 127.0.0.1::6379 `
            --health-cmd 'redis-cli ping' `
            --health-interval 5s --health-timeout 5s --health-retries 10 redis:7
          if ($LASTEXITCODE -ne 0) { throw 'Failed to start the Redis test container.' }

          foreach ($container in @($postgresContainer, $redisContainer)) {
            $deadline = (Get-Date).AddMinutes(2)
            do {
              $health = docker inspect --format '{{.State.Health.Status}}' $container 2>$null
              if ($LASTEXITCODE -eq 0 -and $health -eq 'healthy') { break }
              if ((Get-Date) -ge $deadline) {
                docker logs $container
                throw "Test container '$container' did not become healthy within 2 minutes."
              }
              Start-Sleep -Seconds 2
            } while ($true)
          }

          $postgresPortBinding = docker port $postgresContainer 5432/tcp
          if ($LASTEXITCODE -ne 0) { throw 'Failed to resolve the PostgreSQL host port.' }
          $postgresPortMatch = [regex]::Match([string]$postgresPortBinding, ':(\d+)$')
          if (-not $postgresPortMatch.Success) { throw "Unexpected PostgreSQL host port binding: $postgresPortBinding" }
          $postgresPort = $postgresPortMatch.Groups[1].Value

          $redisPortBinding = docker port $redisContainer 6379/tcp
          if ($LASTEXITCODE -ne 0) { throw 'Failed to resolve the Redis host port.' }
          $redisPortMatch = [regex]::Match([string]$redisPortBinding, ':(\d+)$')
          if (-not $redisPortMatch.Success) { throw "Unexpected Redis host port binding: $redisPortBinding" }
          $redisPort = $redisPortMatch.Groups[1].Value

          Add-Content -Path $env:GITHUB_ENV -Value "TEST_DATABASE_URL=postgres://family_user:family_password@127.0.0.1:$postgresPort/family_messenger_test?sslmode=disable"
          Add-Content -Path $env:GITHUB_ENV -Value "TEST_REDIS_URL=redis://127.0.0.1:$redisPort/0"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Download modules
        run: go mod download
      - name: Sharded unit and integration tests
        env:
          BACKEND_TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          testRegex="$(go test -list '^(Test|Example|Fuzz)' ./internal/app | go run ./cmd/test-shard select -shard "$BACKEND_TEST_SHARD" -shards 3 -timings cmd/test-shard/test-durations.json -shard-zero-load 20)"
          go test -json -count=1 -run "$testRegex" ./internal/app | tee "test-events-$BACKEND_TEST_SHARD.jsonl"
          if [ "$BACKEND_TEST_SHARD" = "0" ]; then
            mapfile -t packages < <(go list ./... | grep -v '/internal/app$')
            if [ "${#packages[@]}" -gt 0 ]; then
              go test -count=1 "${packages[@]}"
            fi
          fi
      - name: Upload backend test events
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: backend-test-events-${{ matrix.shard }}
          path: backend/test-events-${{ matrix.shard }}.jsonl
          if-no-files-found: warn
      - name: Stop backend test containers
        if: always()
        shell: powershell
        run: |
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            $suffix = "${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}"
            docker rm -f -v "stovo-test-postgres-$suffix" "stovo-test-redis-$suffix" 2>$null | Out-Null
          }

  backend_lint:
    name: Backend Go lint
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.changes.outputs.backend == 'true' }}
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","tests","Windows"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Cache golangci-lint binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/golangci-lint/v2.14.0
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-v2.14.0
      - name: Install golangci-lint binary
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = '2.14.0'
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'golangci-lint\v2.14.0'
          $binaryPath = Join-Path $toolDirectory 'golangci-lint.exe'
          if (-not (Test-Path $binaryPath)) {
            New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
            $archivePath = Join-Path $env:RUNNER_TEMP "golangci-lint-$version-windows-amd64.zip"
            $extractPath = Join-Path $env:RUNNER_TEMP "golangci-lint-$version-extract"
            $downloadUrl = "https://github.com/golangci/golangci-lint/releases/download/v$version/golangci-lint-$version-windows-amd64.zip"

            Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
            Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
            $downloadedBinary = Join-Path $extractPath "golangci-lint-$version-windows-amd64\golangci-lint.exe"
            if (-not (Test-Path $downloadedBinary)) {
              throw "The golangci-lint archive did not contain '$downloadedBinary'."
            }

            Copy-Item -LiteralPath $downloadedBinary -Destination $binaryPath -Force
            Remove-Item -LiteralPath $archivePath, $extractPath -Force -Recurse
          }

          Add-Content -Path $env:GITHUB_PATH -Value $toolDirectory
          & $binaryPath version
          if ($LASTEXITCODE -ne 0) {
            throw "golangci-lint $version could not start."
          }
      - name: Install golangci-lint binary on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='2.14.0'
          tool_directory="$RUNNER_TEMP/golangci-lint/v$version"
          binary_path="$tool_directory/golangci-lint"
          if [[ ! -x "$binary_path" ]]; then
            mkdir -p "$tool_directory"
            archive_path="$RUNNER_TEMP/golangci-lint-$version-linux-amd64.tar.gz"
            extract_path="$RUNNER_TEMP/golangci-lint-$version-linux-amd64"
            curl --fail --silent --show-error --location \
              "https://github.com/golangci/golangci-lint/releases/download/v$version/golangci-lint-$version-linux-amd64.tar.gz" \
              --output "$archive_path"
            tar -xzf "$archive_path" -C "$RUNNER_TEMP"
            install -m 0755 "$extract_path/golangci-lint" "$binary_path"
            rm -rf "$archive_path" "$extract_path"
          fi
          echo "$tool_directory" >> "$GITHUB_PATH"
          "$binary_path" version
      - name: Configure runner-local golangci-lint cache
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $cachePath = Join-Path $env:USERPROFILE '.cache\golangci-lint'
          New-Item -ItemType Directory -Path $cachePath -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "GOLANGCI_LINT_CACHE=$cachePath"
      - name: Configure Linux golangci-lint cache
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cache_path="$HOME/.cache/golangci-lint"
          mkdir -p "$cache_path"
          echo "GOLANGCI_LINT_CACHE=$cache_path" >> "$GITHUB_ENV"
      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          install-mode: none
          working-directory: backend
          verify: true
          skip-cache: true
          args: --timeout=5m

  backend-ci:
    name: Backend CI
    needs: [changes, backend_test_shards, backend_lint]
    if: >-
      !cancelled() &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.backend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","tests","Windows"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - name: Require successful backend test shards
        env:
          BACKEND_SHARD_RESULT: ${{ needs.backend_test_shards.result }}
          BACKEND_LINT_RESULT: ${{ needs.backend_lint.result }}
        shell: powershell
        run: |
          if ($env:BACKEND_SHARD_RESULT -ne 'success' -or $env:BACKEND_LINT_RESULT -ne 'success') {
            [Console]::Error.WriteLine("Backend test shards or lint did not succeed: $env:BACKEND_SHARD_RESULT / $env:BACKEND_LINT_RESULT")
            exit 1
          }
      - name: Aggregate successful backend shards
        shell: powershell
        run: echo "All backend test shards and lint passed."
