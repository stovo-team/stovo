name: CI/CD Pipeline

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && fromJSON('["self-hosted","Windows","tests"]') || fromJSON('["ubuntu-latest"]') }}
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            frontend:
              - 'frontend/**'
              - 'scripts/check-solid-boundaries.sh'
              - 'docs/engineering/size-baseline.tsv'
              - '.github/workflows/trusted-pr-tests.yml'
              - '.github/workflows/pipeline.yml'
            backend:
              - 'backend/**'
              - 'deploy/migrations/master/**'
              - 'deploy/**'
              - 'scripts/check-solid-boundaries.sh'
              - 'docs/engineering/size-baseline.tsv'
              - '.github/workflows/trusted-pr-tests.yml'
              - '.github/workflows/pipeline.yml'

  pipeline-contract:
    name: Pipeline Contract
    if: github.event.pull_request.draft == false
    runs-on: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && fromJSON('["self-hosted","Windows","tests"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Detect available shell
        if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify pipeline workflow contract
        shell: bash
        run: bash .github/workflows/pipeline.test.sh

  solid-boundaries:
    name: SOLID architecture boundaries
    needs: changes
    if: >-
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend == 'true')
    runs-on: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && fromJSON('["self-hosted","tests","Windows"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - name: SOLID architecture boundaries
        shell: bash
        run: bash scripts/check-solid-boundaries.sh all

  frontend-ci:
    name: Frontend CI
    needs: changes
    if: >-
      github.event.pull_request.draft == false &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && fromJSON('["self-hosted","e2e"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        working-directory: frontend
        run: npm ci
      - name: Test
        shell: bash
        working-directory: frontend
        run: npm test
      - name: Build
        shell: bash
        working-directory: frontend
        run: npm run build

  backend-ci:
    name: Backend CI
    needs: changes
    if: >-
      github.event.pull_request.draft == false &&
      needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, tests, Windows]
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: postgres://family_user:family_password@localhost:5432/family_messenger_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - name: Start Docker Desktop for backend test services
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dockerCli = Get-Command docker.exe -ErrorAction SilentlyContinue
          if (-not $dockerCli) {
            $dockerCliDirectories = @(
              (Join-Path $env:ProgramFiles 'Docker\Docker\resources\bin'),
              (Join-Path $env:LOCALAPPDATA 'Programs\DockerDesktop\resources\bin')
            )
            $dockerCliDirectory = $dockerCliDirectories | Where-Object { Test-Path (Join-Path $_ 'docker.exe') } | Select-Object -First 1
            if (-not $dockerCliDirectory) {
              throw 'Docker CLI was not found. Install Docker Desktop for the Windows runner account.'
            }
            Add-Content -Path $env:GITHUB_PATH -Value $dockerCliDirectory
            $env:PATH = "$dockerCliDirectory;$env:PATH"
          }

          docker desktop start --detach 2>$null | Out-Null
          $desktopStartExitCode = $LASTEXITCODE
          if ($desktopStartExitCode -ne 0) {
            $desktopCandidates = @(
              (Join-Path $env:ProgramFiles 'Docker\Docker\Docker Desktop.exe'),
              (Join-Path $env:LOCALAPPDATA 'Programs\DockerDesktop\Docker Desktop.exe')
            )
            $dockerDesktop = $desktopCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $dockerDesktop) {
              throw 'Docker Desktop was not found. Install it for the Windows runner account.'
            }
            if (-not (Get-Process -Name 'Docker Desktop' -ErrorAction SilentlyContinue)) {
              Start-Process -FilePath $dockerDesktop
            }
          }

          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep -Seconds 3
            $dockerOs = docker info --format '{{.OSType}}' 2>$null
            if ($LASTEXITCODE -eq 0) { break }
          } while ((Get-Date) -lt $deadline)
          if ($LASTEXITCODE -ne 0) {
            throw 'Docker Desktop did not start within 3 minutes. Ensure the Windows runner account can access the Docker engine.'
          }

          if ($dockerOs -ne 'linux') {
            docker desktop engine use linux
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not switch Docker Desktop to Linux containers. Update Docker Desktop to a version with the desktop CLI and allow the runner account to switch engines.'
            }
            $deadline = (Get-Date).AddMinutes(3)
            do {
              Start-Sleep -Seconds 3
              $dockerOs = docker info --format '{{.OSType}}' 2>$null
              if ($LASTEXITCODE -eq 0 -and $dockerOs -eq 'linux') { break }
            } while ((Get-Date) -lt $deadline)
            if ($LASTEXITCODE -ne 0 -or $dockerOs -ne 'linux') {
              throw 'Docker Desktop did not become ready with its Linux container engine within 3 minutes.'
            }
          }
      - name: Start PostgreSQL and Redis test containers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = "${{ github.run_id }}-${{ github.run_attempt }}"
          $postgresContainer = "stovo-test-postgres-$suffix"
          $redisContainer = "stovo-test-redis-$suffix"

          docker rm -f $postgresContainer $redisContainer 2>$null | Out-Null
          docker run --detach --name $postgresContainer --publish 5432:5432 `
            --env POSTGRES_USER=family_user `
            --env POSTGRES_PASSWORD=family_password `
            --env POSTGRES_DB=family_messenger_test `
            --health-cmd 'pg_isready -U family_user -d family_messenger_test' `
            --health-interval 5s --health-timeout 5s --health-retries 10 postgres:16
          if ($LASTEXITCODE -ne 0) { throw 'Failed to start the PostgreSQL test container.' }

          docker run --detach --name $redisContainer --publish 6379:6379 `
            --health-cmd 'redis-cli ping' `
            --health-interval 5s --health-timeout 5s --health-retries 10 redis:7
          if ($LASTEXITCODE -ne 0) { throw 'Failed to start the Redis test container.' }

          foreach ($container in @($postgresContainer, $redisContainer)) {
            $deadline = (Get-Date).AddMinutes(2)
            do {
              $health = docker inspect --format '{{.State.Health.Status}}' $container 2>$null
              if ($LASTEXITCODE -eq 0 -and $health -eq 'healthy') { break }
              if ((Get-Date) -ge $deadline) {
                docker logs $container
                throw "Test container '$container' did not become healthy within 2 minutes."
              }
              Start-Sleep -Seconds 2
            } while ($true)
          }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Download modules
        run: go mod download
      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          install-mode: binary
          working-directory: backend
          verify: true
          skip-cache: false
          args: --timeout=5m
      - name: Unit and integration tests
        run: go test -count=1 ./...
      - name: Stop backend test containers
        if: always()
        shell: powershell
        run: |
          if (Get-Command docker.exe -ErrorAction SilentlyContinue) {
            $suffix = "${{ github.run_id }}-${{ github.run_attempt }}"
            docker rm -f "stovo-test-postgres-$suffix" "stovo-test-redis-$suffix" 2>$null | Out-Null
          }
