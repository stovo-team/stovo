name: CI/CD Pipeline

on:
  pull_request_target:
    branches: [master, 'feature/**', 'hotfix/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Windows","tests"]') || fromJSON('["ubuntu-24.04"]') }}
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            frontend:
              - 'frontend/**'
              - 'scripts/check-frontend-css-size.cjs'
              - 'scripts/check-frontend-css-size.test.cjs'
              - '.github/workflows/frontend-dependencies.mjs'
            backend:
              - 'backend/**'
              - '.github/workflows/backend-test-services.ps1'
              - '.github/workflows/backend-test-shards.sh'
              - 'deploy/migrations/master/**'
              - 'deploy/**'

  pipeline-contract:
    name: Pipeline Contract
    needs: changes
    if: github.event.pull_request.draft == false
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Windows","tests"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - name: Configure Git long paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Detect available shell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify pipeline workflow contract
        shell: bash
        run: bash .github/workflows/pipeline.test.sh
      - name: Validate PR description progressive disclosure structure
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/agent-workflows/validate-pr-description.mjs --body "$PR_BODY" --frontend "${{ needs.changes.outputs.frontend }}" --backend "${{ needs.changes.outputs.backend }}"
  frontend_dependencies:
    name: Prepare frontend dependencies
    needs: [changes, pipeline-contract]
    if: ${{ !cancelled() && needs.pipeline-contract.result == 'success' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.frontend == 'true' }}
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","e2e"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Configure Git long paths and workspace
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git config --global core.longpaths true
          if (Test-Path frontend\node_modules) {
            Remove-Item -LiteralPath frontend\node_modules -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) { throw "Git for Windows Bash was not found at '$gitBash'." }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Prepare frontend dependencies from the local runner cache
        shell: bash
        env:
          FRONTEND_DEPENDENCY_CACHE_WRITE: 'false'
        run: node .github/workflows/frontend-dependencies.mjs prepare

  frontend_test_shards:
    name: Frontend CI test shards
    needs: [changes, frontend_dependencies]
    if: >-
      !cancelled() &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","e2e"]') || fromJSON('["ubuntu-24.04"]') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      VITEST_MAX_WORKERS: '1'
    steps:
      - name: Configure Git long paths and workspace
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git config --global core.longpaths true
          if (Test-Path frontend\node_modules) {
            Remove-Item -LiteralPath frontend\node_modules -Recurse -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Restore frontend dependencies from the local runner cache
        shell: bash
        run: node .github/workflows/frontend-dependencies.mjs restore
      - name: CSS size guard
        if: matrix.shard == 1
        shell: bash
        working-directory: frontend
        run: npm run check:css-size
      - name: Dependency audit check
        if: matrix.shard == 1
        shell: bash
        working-directory: frontend
        run: npm run audit
      - name: Test
        shell: bash
        working-directory: frontend
        run: npm test -- --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile=frontend-test-timings-${{ matrix.shard }}.json
      - name: Upload frontend test timing report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: frontend-test-timings-${{ matrix.shard }}
          path: frontend/frontend-test-timings-${{ matrix.shard }}.json
          if-no-files-found: ignore
      - name: Build
        if: matrix.shard == 1
        shell: bash
        working-directory: frontend
        run: npm run build

  frontend-ci:
    name: Frontend CI
    needs: [changes, frontend_test_shards]
    if: >-
      !cancelled() &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.frontend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","e2e"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - name: Require successful frontend test shards
        env:
          FRONTEND_SHARD_RESULT: ${{ needs.frontend_test_shards.result }}
        shell: powershell
        run: |
          if ($env:FRONTEND_SHARD_RESULT -ne 'success') {
            throw "Frontend test shards did not succeed: $env:FRONTEND_SHARD_RESULT"
          }
      - name: Aggregate successful frontend shards
        run: echo "All frontend test shards and build passed."

  backend_test_shards:
    name: Backend CI test shards
    needs: [changes, pipeline-contract, backend_lint]
    if: >-
      !cancelled() &&
      needs.pipeline-contract.result == 'success' &&
      needs.backend_lint.result == 'success' &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.backend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","tests","Windows"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Configure Git long paths
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) { throw "Git for Windows Bash was not found at '$gitBash'." }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - name: Start shared test services on Windows runner
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: .github/workflows/backend-test-services.ps1 -Action Start
      - name: Start shared test services on hosted Linux runner
        if: runner.os == 'Linux'
        shell: powershell
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = "${{ github.run_id }}-${{ github.run_attempt }}"
          $postgresContainer = "stovo-test-postgres-$suffix"
          $redisContainer = "stovo-test-redis-$suffix"
          docker rm -f -v $postgresContainer $redisContainer 2>$null | Out-Null
          docker run --detach --name $postgresContainer --publish 127.0.0.1::5432 `
            --env POSTGRES_USER=family_user --env POSTGRES_PASSWORD=family_password `
            --env POSTGRES_DB=family_messenger_test `
            --health-cmd 'pg_isready -U family_user -d family_messenger_test' `
            --health-interval 5s --health-timeout 5s --health-retries 10 postgres:16
          if ($LASTEXITCODE -ne 0) { throw 'Failed to start PostgreSQL test container.' }
          docker run --detach --name $redisContainer --publish 127.0.0.1::6379 `
            --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 5s --health-retries 10 redis:7
          if ($LASTEXITCODE -ne 0) { throw 'Failed to start Redis test container.' }
          foreach ($container in @($postgresContainer, $redisContainer)) {
            $deadline = (Get-Date).AddMinutes(2)
            do {
              $health = docker inspect --format '{{.State.Health.Status}}' $container 2>$null
              if ($LASTEXITCODE -eq 0 -and $health -eq 'healthy') { break }
              if ((Get-Date) -ge $deadline) { docker logs $container; throw "Test container '$container' was unhealthy." }
              Start-Sleep -Seconds 2
            } while ($true)
          }
          foreach ($shard in 0, 1, 2) {
            docker exec $postgresContainer createdb -U family_user "family_messenger_test_shard_$shard"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create shard database $shard." }
          }
          $postgresPort = [regex]::Match([string](docker port $postgresContainer 5432/tcp), ':(\d+)$').Groups[1].Value
          $redisPort = [regex]::Match([string](docker port $redisContainer 6379/tcp), ':(\d+)$').Groups[1].Value
          if (-not $postgresPort -or -not $redisPort) { throw 'Failed to resolve service ports.' }
          Add-Content -Path $env:GITHUB_ENV -Value "POSTGRES_PORT=$postgresPort"
          Add-Content -Path $env:GITHUB_ENV -Value "REDIS_PORT=$redisPort"
      - name: Report Windows runner capacity
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Runner capacity: $([Environment]::ProcessorCount) logical CPUs; $([math]::Round($os.TotalVisibleMemorySize / 1MB, 1)) GiB RAM; $([math]::Round($os.FreePhysicalMemory / 1MB, 1)) GiB available."
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Download modules
        run: go mod download
      - name: Run three isolated backend test shards concurrently
        env:
          BACKEND_TEST_SHARD_ZERO_LOAD: 20
          BACKEND_TEST_WITH_COVERAGE: 'false'
        run: bash ../.github/workflows/backend-test-shards.sh
      - name: Upload backend test events shard 0
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: backend-test-events-0
          path: backend/test-events-0.jsonl
          if-no-files-found: warn
      - name: Upload backend test events shard 1
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: backend-test-events-1
          path: backend/test-events-1.jsonl
          if-no-files-found: warn
      - name: Upload backend test events shard 2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: backend-test-events-2
          path: backend/test-events-2.jsonl
          if-no-files-found: warn
      - name: Stop shared backend test containers
        if: always()
        shell: powershell
        working-directory: .
        run: |
          if ('${{ runner.os }}' -eq 'Windows') {
            .github/workflows/backend-test-services.ps1 -Action Stop
          } else {
            $suffix = "${{ github.run_id }}-${{ github.run_attempt }}"
            docker rm -f -v "stovo-test-postgres-$suffix" "stovo-test-redis-$suffix" 2>$null | Out-Null
          }

  backend_lint:
    name: Backend Go lint
    needs: [changes, pipeline-contract]
    if: ${{ !cancelled() && needs.pipeline-contract.result == 'success' && github.event.pull_request.draft == false && needs.changes.outputs.backend == 'true' }}
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","tests","Windows"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - name: Ensure Git Bash is available on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop
          $gitRoot = Split-Path (Split-Path $git.Source -Parent) -Parent
          $gitBash = Join-Path $gitRoot 'bin\bash.exe'
          if (-not (Test-Path $gitBash)) {
            throw "Git for Windows Bash was not found at '$gitBash'. Install Git for Windows on the self-hosted runner."
          }

          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $gitBash -Parent)
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Cache golangci-lint binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/golangci-lint/v2.14.0
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-v2.14.0
      - name: Install golangci-lint binary
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = '2.14.0'
          $toolDirectory = Join-Path $env:RUNNER_TEMP 'golangci-lint\v2.14.0'
          $binaryPath = Join-Path $toolDirectory 'golangci-lint.exe'
          if (-not (Test-Path $binaryPath)) {
            New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
            $archivePath = Join-Path $env:RUNNER_TEMP "golangci-lint-$version-windows-amd64.zip"
            $extractPath = Join-Path $env:RUNNER_TEMP "golangci-lint-$version-extract"
            $downloadUrl = "https://github.com/golangci/golangci-lint/releases/download/v$version/golangci-lint-$version-windows-amd64.zip"

            Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
            Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
            $downloadedBinary = Join-Path $extractPath "golangci-lint-$version-windows-amd64\golangci-lint.exe"
            if (-not (Test-Path $downloadedBinary)) {
              throw "The golangci-lint archive did not contain '$downloadedBinary'."
            }

            Copy-Item -LiteralPath $downloadedBinary -Destination $binaryPath -Force
            Remove-Item -LiteralPath $archivePath, $extractPath -Force -Recurse
          }

          Add-Content -Path $env:GITHUB_PATH -Value $toolDirectory
          & $binaryPath version
          if ($LASTEXITCODE -ne 0) {
            throw "golangci-lint $version could not start."
          }
      - name: Install golangci-lint binary on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version='2.14.0'
          tool_directory="$RUNNER_TEMP/golangci-lint/v$version"
          binary_path="$tool_directory/golangci-lint"
          if [[ ! -x "$binary_path" ]]; then
            mkdir -p "$tool_directory"
            archive_path="$RUNNER_TEMP/golangci-lint-$version-linux-amd64.tar.gz"
            extract_path="$RUNNER_TEMP/golangci-lint-$version-linux-amd64"
            curl --fail --silent --show-error --location \
              "https://github.com/golangci/golangci-lint/releases/download/v$version/golangci-lint-$version-linux-amd64.tar.gz" \
              --output "$archive_path"
            tar -xzf "$archive_path" -C "$RUNNER_TEMP"
            install -m 0755 "$extract_path/golangci-lint" "$binary_path"
            rm -rf "$archive_path" "$extract_path"
          fi
          echo "$tool_directory" >> "$GITHUB_PATH"
          "$binary_path" version
      - name: Configure runner-local golangci-lint cache
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $cachePath = Join-Path $env:USERPROFILE '.cache\golangci-lint'
          New-Item -ItemType Directory -Path $cachePath -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "GOLANGCI_LINT_CACHE=$cachePath"
      - name: Configure Linux golangci-lint cache
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cache_path="$HOME/.cache/golangci-lint"
          mkdir -p "$cache_path"
          echo "GOLANGCI_LINT_CACHE=$cache_path" >> "$GITHUB_ENV"
      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          install-mode: none
          working-directory: backend
          verify: true
          skip-cache: true
          args: --timeout=10m
      - name: Go architecture boundary check
        shell: bash
        working-directory: backend
        run: go test -v -run TestArchitectureLayerBoundaries ./internal
      - name: Go vulnerability check
        shell: bash
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

  backend-ci:
    name: Backend CI
    needs: [changes, backend_test_shards, backend_lint]
    if: >-
      !cancelled() &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.backend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","tests","Windows"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - name: Require successful backend test shards
        env:
          BACKEND_SHARD_RESULT: ${{ needs.backend_test_shards.result }}
          BACKEND_LINT_RESULT: ${{ needs.backend_lint.result }}
        shell: powershell
        run: |
          if ($env:BACKEND_SHARD_RESULT -ne 'success' -or $env:BACKEND_LINT_RESULT -ne 'success') {
            [Console]::Error.WriteLine("Backend test shards or lint did not succeed: $env:BACKEND_SHARD_RESULT / $env:BACKEND_LINT_RESULT")
            exit 1
          }
      - name: Aggregate successful backend shards
        shell: powershell
        run: echo "All backend test shards and lint passed."
