name: Caddy HTTPS Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: caddy-https-watchdog
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Verify HTTPS and restart an unresponsive Caddy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            app_domain="$(sed -n 's/^APP_DOMAIN=//p' .env | tail -n 1)"
            test -n "$app_domain"

            check_https() {
              curl --fail --silent --show-error --max-time 10 \
                --resolve "$app_domain:443:127.0.0.1" \
                "https://$app_domain/" > /dev/null 2>&1 || return 1
            }

            if check_https; then
              exit 0
            fi

            echo "Caddy HTTPS probe failed; restarting only the reverse proxy."
            if [ -f deploy/compose/production-multiserver.yml ] && sudo docker ps --format '{{.Names}}' | grep -q 'stovo-caddy-gateway'; then
              sudo docker compose --project-directory . -f deploy/compose/production-multiserver.yml restart caddy
            else
              sudo docker compose --project-directory . -f deploy/compose/production-bluegreen.yml restart caddy
            fi

            for _ in $(seq 1 15); do
              if check_https; then
                echo "HTTPS recovered."
                exit 0
              fi
              sleep 2
            done

            if [ -f deploy/compose/production-multiserver.yml ] && sudo docker ps --format '{{.Names}}' | grep -q 'stovo-caddy-gateway'; then
              sudo docker compose --project-directory . -f deploy/compose/production-multiserver.yml ps
              sudo docker compose --project-directory . -f deploy/compose/production-multiserver.yml logs --tail=150 caddy frontend orchestrator
            else
              sudo docker compose --project-directory . -f deploy/compose/production-bluegreen.yml ps
              sudo docker compose --project-directory . -f deploy/compose/production-bluegreen.yml logs --tail=150 caddy frontend backend-blue backend-green
            fi
            exit 1
