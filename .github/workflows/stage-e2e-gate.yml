name: Deploy Stage & E2E

on:
  push:
    branches: [ stage ]
  workflow_dispatch:
    inputs:
      stage_url:
        description: 'Stage Base URL for E2E Tests'
        required: false

concurrency:
  group: stage-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-stage:
    name: Deploy stage stack
    runs-on: [self-hosted, tests]
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy Stage Compose Environment
        env:
          DEPLOY_HOST: ${{ vars.STAGE_DEPLOY_HOST }}
          STAGE_PATH: /opt/stovo/stage
          STAGE_URL: ${{ inputs.stage_url || vars.STAGE_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash deploy/scripts/deploy-stage.sh

  stage-e2e:
    name: Run E2E against stage
    needs: deploy-stage
    runs-on: [self-hosted, e2e]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E Dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./e2e
        run: npx playwright install chromium

      - name: Run E2E Playwright Suite against Stage
        working-directory: ./e2e
        env:
          E2E_BASE_URL: ${{ inputs.stage_url || vars.STAGE_URL }}
          CI: 'true'
        run: npm run test:ci

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage-e2e-report
          path: e2e/playwright-report/
          retention-days: 14
