name: Deploy Stage & E2E

on:
  push:
    branches: [ stage ]
  workflow_dispatch:
    inputs:
      stage_url:
        description: 'Stage Base URL for E2E Tests'
        required: false
        default: 'http://10.29.106.221:9081'

concurrency:
  group: stage-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-stage:
    name: Deploy stage stack
    runs-on: [self-hosted, tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Stage Compose Environment
        env:
          DEPLOY_HOST: 10.29.106.221
          STAGE_PATH: /opt/stovo/stage
          STAGE_URL: ${{ inputs.stage_url || 'http://10.29.106.221:9081' }}
        run: bash scripts/deploy-stage.sh

  stage-e2e:
    name: Run E2E against stage
    needs: deploy-stage
    runs-on: [self-hosted, e2e]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E Dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./e2e
        run: npx playwright install chromium

      - name: Run E2E Playwright Suite against Stage
        working-directory: ./e2e
        env:
          E2E_BASE_URL: ${{ inputs.stage_url || 'http://10.29.106.221:9081' }}
          CI: 'true'
        run: npm run test:ci

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-e2e-report
          path: e2e/playwright-report/
          retention-days: 14
