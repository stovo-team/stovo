# Build a signed release APK and publish to Telegram.
#
# CI calls the Telegram Bot API directly (no separate release-bot server required).
# Optional: if RELEASE_BOT_URL + RELEASE_BOT_SECRET are set, also POSTs to
# https://github.com/left-try/release-bot webhook for formatted release notes.
#
# Required repository secrets:
#   TELEGRAM_BOT_TOKEN   — bot token from @BotFather (bot must be channel admin)
#   TELEGRAM_CHAT_ID     — target channel ID (e.g. -1001234567890)
#
# Optional (LLM release notes from commit history):
#   OPENAI_API_KEY       — OpenAI API key (alias: OPEN_AI_API_KEY; falls back to commit list if unset)
#   OPENAI_MODEL         — repo variable, optional (default in workflow: gpt-4.1-nano)
#
# Optional (release-bot sidecar):
#   RELEASE_BOT_URL      — base URL (e.g. https://releases.example.com)
#   RELEASE_BOT_SECRET   — WEBHOOK_SECRET bearer token
#
# Optional (for signed release APKs):
#   ANDROID_KEYSTORE_BASE64   — base64-encoded .jks or .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Without keystore secrets the workflow builds an unsigned release APK
# (sideloadable for family distribution).

name: Android Release

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx @capacitor/cli@8 sync android

      - name: Prepare signing keystore
        working-directory: frontend/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/frontend/android/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing enabled"
          else
            echo "No keystore secret — building unsigned release APK"
          fi

      - name: Build release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            --no-daemon

      - name: Locate APK artifact
        id: apk
        run: |
          APK=$(find frontend/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found under app/build/outputs/apk/release" >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK ($(du -h "$APK" | cut -f1))"

      - name: Resolve version label
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' frontend/android/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "label=${VERSION_NAME}-build${{ github.run_number }} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -eu
          if [ -z "${OPENAI_API_KEY:-}" ]; then OPENAI_API_KEY="${OPEN_AI_API_KEY:-}"; fi
          MODEL="${OPENAI_MODEL:-gpt-4.1-nano}"
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE}..${{ github.sha }}"
          else
            RANGE="-20"
          fi

          COMMITS=$(git log --pretty=format:'- %s (%h)' "$RANGE" 2>/dev/null | head -40)
          if [ -z "$COMMITS" ]; then
            COMMITS=$(git log -15 --pretty=format:'- %s (%h)')
          fi

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY not set — using commit list"
            SUMMARY=$(printf 'Что нового:\n%s' "$COMMITS")
          else
            PROMPT=$(printf 'Write short release notes for the Stovo family messenger Android app.\nAudience: family members, not developers.\nFormat: plain text, 2-5 bullet points, friendly tone. Match the language of the commits.\nNo markdown headers, no hype.\n\nCommits:\n%s' "$COMMITS")
            RESPONSE=$(curl -fsSL https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer ${OPENAI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg model "${MODEL}" \
                --arg prompt "$PROMPT" \
                '{
                  model: $model,
                  max_tokens: 280,
                  temperature: 0.4,
                  messages: [
                    {role: "system", content: "You write concise mobile app release notes."},
                    {role: "user", content: $prompt}
                  ]
                }')")
            SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
            if [ -z "$SUMMARY" ]; then
              echo "OpenAI call failed, falling back to commit list" >&2
              echo "$RESPONSE" >&2
              SUMMARY=$(printf 'Что нового:\n%s' "$COMMITS")
            fi
          fi

          {
            echo 'summary<<EOF'
            printf '%s' "$SUMMARY"
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post release notice to Telegram
        run: |
          TEXT=$(printf '📱 Stovo %s\n\n%s\n\n⬇️ APK attached below' \
            "${{ steps.version.outputs.label }}" \
            "${{ steps.notes.outputs.summary }}")
          curl -fsSL "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${TEXT}"

      - name: Notify release-bot webhook (optional)
        continue-on-error: true
        env:
          RELEASE_BOT_URL: ${{ secrets.RELEASE_BOT_URL }}
          RELEASE_BOT_SECRET: ${{ secrets.RELEASE_BOT_SECRET }}
        run: |
          if [ -z "$RELEASE_BOT_URL" ] || [ -z "$RELEASE_BOT_SECRET" ]; then
            echo "Skipping release-bot (RELEASE_BOT_URL or RELEASE_BOT_SECRET not set)"
            exit 0
          fi
          BODY=$(jq -n \
            --arg project "Stovo Android" \
            --arg version "${{ steps.version.outputs.label }}" \
            --arg message "${{ steps.notes.outputs.summary }}" \
            '{project: $project, version: $version, message: $message}')
          curl -fsSL -X POST "${RELEASE_BOT_URL}/webhook" \
            -H "Authorization: Bearer ${RELEASE_BOT_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary "$BODY"

      - name: Upload APK to Telegram channel
        run: |
          CAPTION=$(printf 'Stovo %s' "${{ steps.version.outputs.label }}")
          curl -fsSL "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "document=@${{ steps.apk.outputs.path }}" \
            -F "caption=${CAPTION}"

      - name: Upload APK as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: stovo-android-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
