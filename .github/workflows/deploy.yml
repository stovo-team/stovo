# Deploy Stovo to Cloud.ru Evolution via SSH.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# Optional: DEPLOY_SSH_PORT (default 22)
#
# DEPLOY_PATH example: /home/user1/Stovo

name: Deploy Web

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'frontend/android/**'
      - '.planning/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            # Force-pushed / rewritten history is expected; sync exactly to remote.
            git fetch origin master
            git checkout master
            git reset --hard origin/master
            sudo docker compose version
            # The backend runs as the distroless non-root user (UID 65532).
            # Keep its bind-mounted log directory writable after every deploy.
            sudo install -d -m 0750 -o 65532 -g 65532 logs
            sudo chown -R 65532:65532 logs
            sudo docker compose down
            sudo docker compose up -d --build
