# Deploy Stovo to Cloud.ru Evolution via SSH.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# Optional: DEPLOY_SSH_PORT (default 22)
#
# DEPLOY_PATH example: /home/user1/Stovo

name: Deploy Web

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'frontend/android/**'
      - '.planning/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            # The running backend owns uploads. Give Git temporary access so it
            # can restore the tracked placeholder during the working-tree sync.
            sudo install -d -m 0750 -o "$(id -u)" -g "$(id -g)" uploads
            sudo chown -R "$(id -u):$(id -g)" uploads
            # Force-pushed / rewritten history is expected; sync exactly to remote.
            git fetch origin master
            git checkout master
            git reset --hard origin/master
            # Older production .env files predate the MinIO service. Preserve
            # existing values and generate secrets only for keys that are absent.
            test -f .env
            umask 077
            ensure_env() {
              key="$1"
              value="$2"
              if ! grep -q "^${key}=." .env; then
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            }
            ensure_env MINIO_ROOT_USER stovo_minio_root
            ensure_env MINIO_ROOT_PASSWORD "$(openssl rand -hex 32)"
            ensure_env MINIO_ACCESS_KEY stovo_backend
            ensure_env MINIO_SECRET_KEY "$(openssl rand -hex 32)"
            sudo docker compose version
            # The backend runs as the distroless non-root user (UID 65532).
            # Keep the read-only migration source accessible until cutover is accepted.
            sudo install -d -m 0750 -o 65532 -g 65532 uploads
            sudo chown -R 65532:65532 uploads
            sudo docker compose down
            sudo docker compose up -d --build
