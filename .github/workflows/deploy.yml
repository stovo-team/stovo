# Deploy Stovo to production server via SSH.
#
# Secrets required: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# Optional: DEPLOY_SSH_PORT (default 22)

name: Deploy Web

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'frontend/android/**'
      - '.planning/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, tests]
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            
            # Fetch latest git master
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            test -f .env || touch .env
            umask 077
            ensure_env() { key="$1"; value="$2"; if ! grep -q "^${key}=." .env; then printf '\n%s=%s\n' "$key" "$value" >> .env; fi; }
            ensure_env MINIO_ROOT_USER stovo_minio_root
            ensure_env MINIO_ROOT_PASSWORD "$(openssl rand -hex 32)"
            ensure_env MINIO_ACCESS_KEY stovo_backend
            ensure_env MINIO_SECRET_KEY "$(openssl rand -hex 32)"
            ensure_env MASTER_ADMIN_USER admin
            ensure_env MASTER_ADMIN_PASSWORD admin123
            ensure_env MASTER_SYSTEM_SECRET super_secret_master_key_123

            get_env() { key="$1"; default="${2:-}"; val="$(sed -n "s/^${key}=//p" .env 2>/dev/null | tail -n 1 | tr -d '\r')"; val="${val%\"}"; val="${val#\"}"; val="${val%\'}"; val="${val#\'}"; if [ -n "$val" ]; then printf '%s' "$val"; else printf '%s' "$default"; fi; }

            # Docker can leave build layers, dangling images, stopped containers,
            # and unused networks behind.  Recover only when Docker explicitly
            # reports an out-of-space failure, then retry the failed operation.
            # Volumes are deliberately never pruned: they hold PostgreSQL, Redis,
            # MinIO, and Caddy state.
            docker_with_space_recovery() {
              deploy_log="$(mktemp)"
              if "$@" >"$deploy_log" 2>&1; then
                cat "$deploy_log"
                rm -f "$deploy_log"
                return 0
              fi
              deploy_status=$?
              cat "$deploy_log" >&2
              if ! grep -Eqi 'no space left on device|disk quota exceeded|write /var/lib/docker/.+no space' "$deploy_log"; then
                rm -f "$deploy_log"
                return "$deploy_status"
              fi
              echo "Docker ran out of disk space; pruning unused Docker cache and retrying once..." >&2
              sudo docker builder prune -af
              sudo docker image prune -af
              sudo docker container prune -f
              sudo docker network prune -f
              rm -f "$deploy_log"
              "$@"
            }

            pg_user="$(get_env POSTGRES_USER family_user)"
            pg_pass="$(get_env POSTGRES_PASSWORD family_password)"
            pg_db="$(get_env POSTGRES_DB family_messenger)"
            app_domain="$(get_env APP_DOMAIN stovo-cloud.stovo.ru)"

            # Ensure master database, cache & minio services are running
            sudo docker compose -f docker-compose.master.yml up -d postgres redis minio
            
            # Wait for postgres to be healthy
            for _ in $(seq 1 30); do if sudo docker compose -f docker-compose.master.yml exec -T postgres pg_isready -U "$pg_user" >/dev/null 2>&1; then break; fi; sleep 2; done

            # Apply master database migrations
            for migration in $(find migrations/master -maxdepth 1 -name '*.sql' | sort); do
              echo "Applying master migration: $migration"
              cat "$migration" | sudo docker compose -f docker-compose.master.yml exec -T postgres psql -U "$pg_user" -d "$pg_db"
            done

            # Build backend docker image for child servers
            # Migration files are immutable once deployed. Verify the Atlas
            # manifest before building or touching any tenant database; never
            # regenerate atlas.sum on this host, because that would mask a
            # rewritten historical migration.
            docker_with_space_recovery sudo docker run --rm -v "$PWD/backend/migrations:/migrations:ro" arigaio/atlas:1.3.2 \
              migrate validate --dir file:///migrations
            docker_with_space_recovery sudo docker build -t stovo-backend ./backend

            # Build and deploy frontend, orchestrator, and caddy gateway
            docker_with_space_recovery sudo docker compose -f docker-compose.master.yml up -d --build frontend orchestrator caddy coturn
            # Caddyfile is bind-mounted. Compose does not recreate a container
            # merely because the mounted file changed, and Caddy does not watch
            # it, so explicitly recreate the gateway to load route changes.
            sudo docker compose -f docker-compose.master.yml up -d --force-recreate caddy

            # A running container alone does not prove that Caddy opened its
            # public TLS listener. Check it locally with the production host.
            public_healthy=false
            for _ in $(seq 1 30); do
              if curl --fail --silent --show-error --resolve "$app_domain:443:127.0.0.1" "https://$app_domain/" > /dev/null; then
                public_healthy=true
                break
              fi
              sleep 2
            done
            if [ "$public_healthy" != true ]; then
              sudo docker compose -f docker-compose.master.yml ps
              sudo docker compose -f docker-compose.master.yml logs --tail=100 caddy frontend orchestrator
              exit 1
            fi

            # Perform rolling container update for all running tenant server clusters
            child_containers="$(sudo docker ps -q --filter label=stovo-server || true)"
            if [ -n "$child_containers" ]; then
                echo "Updating active tenant backend containers..."
                for container_id in $child_containers; do
                    server_slug="$(sudo docker inspect --format '{{index .Config.Labels "stovo-server"}}' "$container_id")"
                    if [ -n "$server_slug" ]; then
                        echo "Applying tracked Atlas migrations for server: $server_slug"
                        tenant_database_url="postgres://${pg_user}:${pg_pass}@postgres:5432/stovo_db_${server_slug}?sslmode=disable"
                        # Do not replay raw SQL or ignore migration errors here. Atlas
                        # records each revision in the tenant database, so a successful
                        # rollout means this exact schema is present before the new
                        # backend is allowed to start.
                        docker_with_space_recovery sudo docker run --rm \
                          --network stovo_default \
                          -e "DATABASE_URL=${tenant_database_url}" \
                          stovo-backend \
                          sh -ec 'atlas migrate apply --dir file:///app/migrations --url "$DATABASE_URL"'

                        echo "Re-deploying container for server: $server_slug"
                        # A missing bucket means the tenant's media history has been
                        # lost or the MinIO volume is wrong. Do not hide that incident
                        # by restarting the backend, which would recreate an empty bucket.
                        if ! sudo docker exec stovo-master-minio sh -ec '
                          mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
                          mc stat "local/stovo-$1" >/dev/null
                        ' sh "$server_slug"; then
                          echo "Refusing to redeploy $server_slug: MinIO bucket stovo-$server_slug is missing." >&2
                          exit 1
                        fi
                        active_file_count="$(sudo docker exec stovo-master-db sh -ec '
                          psql -U "$POSTGRES_USER" -d "stovo_db_$1" -tAc "SELECT count(*) FROM files WHERE deleted_at IS NULL" 2>/dev/null || echo 0
                        ' sh "$server_slug")"
                        object_count="$(sudo docker exec stovo-master-minio sh -ec '
                          mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
                          mc find "local/stovo-$1" | wc -l
                        ' sh "$server_slug")"
                        if [ "$object_count" -lt "$active_file_count" ]; then
                          # The bucket exists, so replacing the stateless backend cannot
                          # erase media. Keep the rollout available for application fixes,
                          # but make the storage incident impossible to miss. A separate
                          # restore/reconciliation is still required for the missing objects.
                          echo "WARNING: MinIO has $object_count objects but the database has $active_file_count active files for $server_slug. Deploying backend; restore or reconcile missing media separately." >&2
                        fi
                        # Resolve this by name at the point of replacement. The
                        # initial list can be stale if Docker restarted a tenant
                        # while the migration and storage checks were running.
                        # Inspecting by the exact name avoids a stale ID from the
                        # earlier label scan. A tenant can be recreated by the
                        # orchestrator while migrations and storage checks run.
                        existing_container_id="$(sudo docker inspect --format '{{.Id}}' "stovo-backend-${server_slug}" 2>/dev/null || true)"
                        if [ -n "$existing_container_id" ]; then
                          sudo docker rm -f "$existing_container_id" || true
                        fi
                        master_secret="$(get_env MASTER_SYSTEM_SECRET super_secret_master_key_123)"
                        minio_user="$(get_env MINIO_ROOT_USER stovo_minio_root)"
                        minio_pass="$(get_env MINIO_ROOT_PASSWORD stovo_minio_pass)"
                        turn_enabled="$(get_env TURN_ENABLED true)"
                        turn_host="$(get_env TURN_HOST "$(get_env PUBLIC_HOST "$(get_env PUBLIC_IP stovo.local)")")"
                        turn_port="$(get_env TURN_PORT 3478)"
                        turn_realm="$(get_env TURN_REALM family-messenger)"
                        turn_username="$(get_env TURN_USERNAME family)"
                        turn_password="$(get_env TURN_PASSWORD change_me)"
                        groq_api_key="$(get_env GROQ_API_KEY "$(get_env groq_api_key "$(get_env GROQ_KEY "$(get_env GROQ_API_TOKEN "")")")")"
                        groq_base_url="$(get_env GROQ_BASE_URL "$(get_env GROQ_API_BASE "")")"
                        groq_stt_model="$(get_env GROQ_STT_MODEL whisper-large-v3-turbo)"
                        groq_chat_model="$(get_env GROQ_CHAT_MODEL "")"
                        groq_stt_cost="$(get_env GROQ_STT_COST_PER_AUDIO_HOUR_USD 0.04)"
                        ai_call_transcription="$(get_env AI_CALL_TRANSCRIPTION_ENABLED true)"
                        livekit_url="$(get_env LIVEKIT_URL "")"
                        livekit_api_key="$(get_env LIVEKIT_API_KEY "")"
                        livekit_api_secret="$(get_env LIVEKIT_API_SECRET "")"
                        app_url="$(get_env APP_URL "https://${app_domain}")"
                        server_url="${app_url%/}/s/${server_slug}"
                        if ! docker_with_space_recovery sudo docker run -d \
                          --name "stovo-backend-${server_slug}" \
                          --network stovo_default \
                          --restart unless-stopped \
                          -e "SERVER_ID=${server_slug}" \
                          -e "APP_URL=${server_url}" \
                          -e "API_URL=${server_url}" \
                          -e "DATABASE_URL=postgres://${pg_user}:${pg_pass}@postgres:5432/stovo_db_${server_slug}?sslmode=disable" \
                          -e "REDIS_URL=redis://redis:6379/0" \
                          -e "STORAGE_PROVIDER=minio" \
                          -e "MINIO_ENDPOINT=minio:9000" \
                          -e "MINIO_ACCESS_KEY=${minio_user}" \
                          -e "MINIO_SECRET_KEY=${minio_pass}" \
                          -e "MINIO_FILES_BUCKET=stovo-${server_slug}" \
                          -e "JWT_SECRET=${master_secret}" \
                          -e "MASTER_SYSTEM_SECRET=${master_secret}" \
                          -e "TURN_ENABLED=${turn_enabled}" \
                          -e "TURN_HOST=${turn_host}" \
                          -e "TURN_PORT=${turn_port}" \
                          -e "TURN_REALM=${turn_realm}" \
                          -e "TURN_USERNAME=${turn_username}" \
                          -e "TURN_PASSWORD=${turn_password}" \
                          -e "GROQ_API_KEY=${groq_api_key}" \
                          -e "GROQ_BASE_URL=${groq_base_url}" \
                          -e "GROQ_STT_MODEL=${groq_stt_model}" \
                          -e "GROQ_CHAT_MODEL=${groq_chat_model}" \
                          -e "GROQ_STT_COST_PER_AUDIO_HOUR_USD=${groq_stt_cost}" \
                          -e "AI_CALL_TRANSCRIPTION_ENABLED=${ai_call_transcription}" \
                          -e "LIVEKIT_URL=${livekit_url}" \
                          -e "LIVEKIT_API_KEY=${livekit_api_key}" \
                          -e "LIVEKIT_API_SECRET=${livekit_api_secret}" \
                          --label "stovo-server=${server_slug}" \
                          stovo-backend; then
                          # A concurrent reconciliation can create the named
                          # container between inspect/remove and docker run.
                          # Remove that exact replacement and retry once.
                          concurrent_container_id="$(sudo docker inspect --format '{{.Id}}' "stovo-backend-${server_slug}" 2>/dev/null || true)"
                          if [ -z "$concurrent_container_id" ]; then
                            echo "Failed to start tenant backend $server_slug." >&2
                            exit 1
                          fi
                          echo "Tenant container changed during redeploy; replacing it once more."
                          sudo docker rm -f "$concurrent_container_id" || true
                          docker_with_space_recovery sudo docker run -d \
                            --name "stovo-backend-${server_slug}" \
                            --network stovo_default \
                            --restart unless-stopped \
                            -e "SERVER_ID=${server_slug}" \
                            -e "APP_URL=${server_url}" \
                            -e "API_URL=${server_url}" \
                            -e "DATABASE_URL=postgres://${pg_user}:${pg_pass}@postgres:5432/stovo_db_${server_slug}?sslmode=disable" \
                            -e "REDIS_URL=redis://redis:6379/0" \
                            -e "STORAGE_PROVIDER=minio" \
                            -e "MINIO_ENDPOINT=minio:9000" \
                            -e "MINIO_ACCESS_KEY=${minio_user}" \
                            -e "MINIO_SECRET_KEY=${minio_pass}" \
                            -e "MINIO_FILES_BUCKET=stovo-${server_slug}" \
                            -e "JWT_SECRET=${master_secret}" \
                            -e "MASTER_SYSTEM_SECRET=${master_secret}" \
                            -e "TURN_ENABLED=${turn_enabled}" \
                            -e "TURN_HOST=${turn_host}" \
                            -e "TURN_PORT=${turn_port}" \
                            -e "TURN_REALM=${turn_realm}" \
                            -e "TURN_USERNAME=${turn_username}" \
                            -e "TURN_PASSWORD=${turn_password}" \
                            -e "GROQ_API_KEY=${groq_api_key}" \
                            -e "GROQ_BASE_URL=${groq_base_url}" \
                            -e "GROQ_STT_MODEL=${groq_stt_model}" \
                            -e "GROQ_CHAT_MODEL=${groq_chat_model}" \
                            -e "GROQ_STT_COST_PER_AUDIO_HOUR_USD=${groq_stt_cost}" \
                            -e "AI_CALL_TRANSCRIPTION_ENABLED=${ai_call_transcription}" \
                            -e "LIVEKIT_URL=${livekit_url}" \
                            -e "LIVEKIT_API_KEY=${livekit_api_key}" \
                            -e "LIVEKIT_API_SECRET=${livekit_api_secret}" \
                            --label "stovo-server=${server_slug}" \
                            stovo-backend
                        fi
                    fi
                done
            fi

            echo "Multi-server deployment finished successfully!"
