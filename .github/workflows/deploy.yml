# Deploy Stovo to Cloud.ru Evolution via SSH.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# Optional: DEPLOY_SSH_PORT (default 22)
#
# DEPLOY_PATH example: /home/user1/Stovo

name: Deploy Web

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'frontend/android/**'
      - '.planning/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            # The running backend owns uploads. Give Git temporary access so it
            # can restore the tracked placeholder during the working-tree sync.
            sudo install -d -m 0750 -o "$(id -u)" -g "$(id -g)" uploads
            sudo chown -R "$(id -u):$(id -g)" uploads
            # Force-pushed / rewritten history is expected; sync exactly to remote.
            git fetch origin master
            git checkout master
            git reset --hard origin/master
            # Older production .env files predate the MinIO service. Preserve
            # existing values and generate secrets only for keys that are absent.
            test -f .env
            umask 077
            ensure_env() {
              key="$1"
              value="$2"
              if ! grep -q "^${key}=." .env; then
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi
            }
            ensure_env MINIO_ROOT_USER stovo_minio_root
            ensure_env MINIO_ROOT_PASSWORD "$(openssl rand -hex 32)"
            ensure_env MINIO_ACCESS_KEY stovo_backend
            ensure_env MINIO_SECRET_KEY "$(openssl rand -hex 32)"
            sudo docker compose version
            # The backend runs as Alpine's non-root app user (UID/GID 100).
            # Keep the read-only migration source accessible until cutover is accepted.
            sudo install -d -m 0750 -o 100 -g 100 uploads logs
            sudo chown -R 100:100 uploads logs
            sudo docker compose down
            sudo docker compose up -d --build
            app_domain="$(sed -n 's/^APP_DOMAIN=//p' .env | tail -n 1)"
            healthy=false
            for _ in $(seq 1 30); do
              if curl --fail --silent --resolve "$app_domain:443:127.0.0.1" "https://$app_domain/api/health" > /dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              sudo docker compose ps
              sudo docker compose logs --tail=100 backend caddy minio minio-init
              exit 1
            fi
