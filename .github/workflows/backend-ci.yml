name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".architecture/**"
      - "scripts/check-solid-boundaries.sh"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".architecture/**"
      - "scripts/check-solid-boundaries.sh"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: family_user
          POSTGRES_PASSWORD: family_password
          POSTGRES_DB: family_messenger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_user -d family_messenger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://family_user:family_password@localhost:5432/family_messenger_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Compare a newly added migration against the branch's existing
          # migration history. A shallow checkout cannot reliably inspect the
          # merge base on pull requests.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download modules
        run: go mod download
      - name: Ent generation drift
        run: |
          go generate ./ent
          if ! git diff --quiet -- ent; then
            echo "ent/ is out of date; run go generate ./ent and commit"
            git diff -- ent
            exit 1
          fi
      - name: Unit and integration tests with coverage
        run: |
          # Do not allow a persistent self-hosted runner's Go test cache to
          # conceal an integration failure. Coverage is collected from each
          # package's own tests; using -coverpkg across every internal package
          # makes every test binary enormous and previously exceeded CI's
          # ten-minute test timeout.
          rm -f coverage.out
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          {
            echo "## Backend coverage"
            echo '```text'
            tail -n 1 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error
      - name: SOLID architecture boundaries
        working-directory: ..
        run: bash scripts/check-solid-boundaries.sh backend
      - name: Reject UTF-8 BOMs in Atlas migrations
        run: |
          set -euo pipefail
          # Atlas hashes migration bytes. A BOM can survive in one checkout
          # but be stripped or normalised in another, invalidating atlas.sum.
          if LC_ALL=C grep -rl $'^\xEF\xBB\xBF' migrations --include='*.sql'; then
            echo "Atlas migration files must be UTF-8 without a byte-order mark." >&2
            exit 1
          fi
      - name: Atlas migrate validate
        if: hashFiles('backend/migrations/atlas.sum') != ''
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- -y
          atlas migrate validate --dir "file://migrations"
      - name: Reject out-of-order migrations
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A migration applied to any deployed tenant must never be followed
          # by a newly introduced lower timestamp. Atlas only discovers this
          # once it sees an existing production revision table; catch it in CI.
          if [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -q '^0\{40\}$'; then
            exit 0
          fi

          latest_existing="$(git ls-tree -r --name-only "$BASE_SHA" -- migrations \
            | sed -n 's#^migrations/\([0-9]\{14\}\)_.*\.sql$#\1#p' \
            | sort \
            | tail -n 1)"
          [ -n "$latest_existing" ] || exit 0

          git diff --diff-filter=A --name-only "$BASE_SHA" HEAD -- migrations \
            | while IFS= read -r migration; do
                version="$(printf '%s' "$migration" | sed -n 's#^migrations/\([0-9]\{14\}\)_.*\.sql$#\1#p')"
                [ -n "$version" ] || continue
                if [ "$version" \< "$latest_existing" ] || [ "$version" = "$latest_existing" ]; then
                  echo "New migration $migration is not later than existing migration version $latest_existing." >&2
                  echo "Use a new timestamp after the current migration tail; do not insert migrations into deployed history." >&2
                  exit 1
                fi
              done
      - name: Atlas replay empty install
        if: hashFiles('backend/migrations/*.sql') != ''
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- -y
          atlas migrate apply --dir "file://migrations" --url "$TEST_DATABASE_URL"
      - name: Forbid raw SQL in app packages
        run: |
          set -euo pipefail
          # Allowlisted: *_test.go schema bootstrap strings, health uses store.Ping.
          # Fail if non-test app code still imports database/sql for queries or embeds DML/DDL.
          if rg -n --glob '*.go' --glob '!*_test.go' --glob '!sql_tracer.go' \
            '(\.Query\(|\.QueryRow\(|\.Exec\(|BeginTx\()' \
            internal/app; then
            echo "database/sql query helpers still used in internal/app"
            exit 1
          fi
          if rg -n --glob '*.go' --glob '!*_test.go' \
            '"(SELECT |INSERT |UPDATE |DELETE FROM |CREATE TABLE |ALTER TABLE |DROP TABLE )' \
            internal/app; then
            echo "raw SQL literals found in internal/app (only Atlas migrations + tests allowed)"
            exit 1
          fi
          echo "app SQL gate passed"
