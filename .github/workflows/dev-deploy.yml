name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: [self-hosted, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy develop to the dev stack
        env:
          DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
          DEV_PATH: /opt/stovo/dev
          DEV_URL: ${{ vars.DEV_URL }}
        run: bash scripts/deploy-environment.sh dev
