name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: [self-hosted, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy develop to the dev stack
        env:
          DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
          DEV_PATH: /opt/stovo/dev
          DEV_URL: ${{ vars.DEV_URL }}
        run: bash deploy/scripts/deploy-environment.sh dev
