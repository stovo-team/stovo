name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: [self-hosted, tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy develop to the dev stack
        env:
          DEPLOY_HOST: ${{ vars.DEV_DEPLOY_HOST }}
          DEV_PATH: /opt/stovo/dev
          DEV_URL: ${{ vars.DEV_URL }}
        run: bash deploy/scripts/deploy-environment.sh dev
