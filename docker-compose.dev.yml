# Development Compose Environment for Stovo (Local PC / Dev Container)
# Supports live hot-reloading for frontend and instant backend code restarts.

services:
  postgres:
    image: postgres:16-alpine
    container_name: stovo-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stovo_dev_db}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stovo-dev-redis
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-jobs:
    image: redis:7-alpine
    container_name: stovo-dev-redis-jobs
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-jobs-dev-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: stovo-dev-ntfy
    command: serve
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:80/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: stovo-dev-minio
    command: server /data --address ":9000" --quiet
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stovo_dev_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stovo_dev_pass}
      MINIO_BROWSER: "on"
    volumes:
      - minio-dev-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: stovo-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-stovo_dev_root} ${MINIO_ROOT_PASSWORD:-stovo_dev_pass} &&
      mc mb --ignore-existing local/stovo-files && mc mb --ignore-existing local/stovo-logs && mc mb --ignore-existing local/stovo-calls"

  backend:
    build:
      context: ./backend
    container_name: stovo-dev-backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_URL: ${APP_URL:-http://10.29.106.221:9080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-capacitor://localhost}
      NATIVE_CLIENT_ORIGINS: ${NATIVE_CLIENT_ORIGINS:-capacitor://localhost}
      API_URL: ${API_URL:-http://10.29.106.221:9080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://10.29.106.221:9080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stovo_dev_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_JOBS_URL: redis://redis-jobs:6379/0
      JWT_SECRET: dev_secret_jwt_key_12345
      REFRESH_TOKEN_SECRET: dev_refresh_secret_key_12345
      INVITE_TOKEN_SECRET: dev_invite_secret_key_12345
      MESSAGE_ENCRYPTION_KEY: dev_encryption_key_123456789012
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-stovo_dev_root}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-stovo_dev_pass}
      MINIO_SECURE: "false"
      MINIO_FILES_BUCKET: stovo-files
      MINIO_LOGS_BUCKET: stovo-logs
      MINIO_CALLS_BUCKET: stovo-calls
      NTFY_BASE_URL: http://ntfy:80
      TURN_USERNAME: dev_turn
      TURN_PASSWORD: dev_turn_pass
    expose:
      - "8000"
    volumes:
      - ./backend:/app:rw
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    container_name: stovo-dev-frontend
    restart: unless-stopped
    environment:
      VITE_DISABLE_HMR: "false"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      - backend

  caddy:
    image: caddy:alpine
    container_name: stovo-dev-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      # proxy-1 exposes this as http://10.29.106.221:9080.
      - "127.0.0.1:8080:8000"
    environment:
      APP_DOMAIN: 10.29.106.221
      ACTIVE_BACKEND: backend
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro

volumes:
  postgres-dev-data:
  redis-dev-data:
  redis-jobs-dev-data:
  minio-dev-data:
