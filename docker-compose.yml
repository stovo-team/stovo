services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_password}
      POSTGRES_DB: ${POSTGRES_DB:-family_messenger}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:80/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:8000}
      API_URL: ${API_URL:-http://localhost:8000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://frontend:5173}
      PUBLIC_TUNNEL_ORIGIN: ${PUBLIC_TUNNEL_ORIGIN:-http://127.0.0.1:8000}
      PUBLIC_REACHABILITY_CHECKER_URL: ${PUBLIC_REACHABILITY_CHECKER_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-family_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_password}
      POSTGRES_DB: ${POSTGRES_DB:-family_messenger}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change_me_too}
      INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET:-change_me_invites}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-family_refresh_token}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_PATH: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE_PATH: /app/logs/backend.log
      LOG_BUFFER_MAX_RECORDS: ${LOG_BUFFER_MAX_RECORDS:-2000}
      TURN_ENABLED: ${TURN_ENABLED:-true}
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_REALM: ${TURN_REALM:-family-messenger}
      TURN_USERNAME: ${TURN_USERNAME:-family}
      TURN_PASSWORD: ${TURN_PASSWORD:-change_me}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://ntfy:80}
      NTFY_PUBLISH_TOKEN: ${NTFY_PUBLISH_TOKEN:-}
    expose:
      - "8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ntfy:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_DISABLE_HMR: ${VITE_DISABLE_HMR:-true}
    expose:
      - "5173"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # Host networking is required on Linux so coturn sees real client IPs
    # and UDP relay works without Docker NAT interfering.
    # On macOS/Windows for local dev this is ignored — coturn won't relay
    # but that's fine since both WebRTC peers are on localhost anyway.
    network_mode: host
    environment:
      TURN_USERNAME: ${TURN_USERNAME:-family}
      TURN_PASSWORD: ${TURN_PASSWORD:-change_me}
      TURN_REALM: ${TURN_REALM:-family-messenger}
      PUBLIC_IP: ${PUBLIC_IP:-}
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --user=${TURN_USERNAME:-family}:${TURN_PASSWORD:-change_me}
      - --realm=${TURN_REALM:-family-messenger}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP}

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  ntfy-cache:
  ntfy-auth:
