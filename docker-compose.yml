services:
  postgres:
    image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ntfy:
    image: binwiederhier/ntfy@sha256:4a7d0f0adc6d5d9fc36e64ab55ef676e76e124a2bdd50ce115b6d9c1c7430294
    command: serve
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:80/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/stovo-files && mc mb --ignore-existing local/stovo-logs &&
      mc admin user add local $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY || true &&
      mc admin policy attach local readwrite --user $$MINIO_ACCESS_KEY &&
      (mc ilm rule add --expire-days 90 local/stovo-logs || true)"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:8000}
      API_URL: ${API_URL:-http://localhost:8000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://frontend:8080}
      PUBLIC_REACHABILITY_CHECKER_URL: ${PUBLIC_REACHABILITY_CHECKER_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env}
      INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET:?Set INVITE_TOKEN_SECRET in .env}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-family_refresh_token}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:?Set MESSAGE_ENCRYPTION_KEY in .env}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      LOCAL_STORAGE_PATH: /app/uploads
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_SECURE: "false"
      MINIO_FILES_BUCKET: stovo-files
      MINIO_LOGS_BUCKET: stovo-logs
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE_PATH: /app/logs/backend.log
      LOG_BUFFER_MAX_RECORDS: ${LOG_BUFFER_MAX_RECORDS:-2000}
      TURN_ENABLED: ${TURN_ENABLED:-true}
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_REALM: ${TURN_REALM:-family-messenger}
      TURN_USERNAME: ${TURN_USERNAME:?Set TURN_USERNAME in .env}
      TURN_PASSWORD: ${TURN_PASSWORD:?Set TURN_PASSWORD in .env}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://ntfy:80}
      NTFY_PUBLISH_TOKEN: ${NTFY_PUBLISH_TOKEN:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    expose:
      - "8000"
    volumes:
      # Local storage remains supported for existing installations that have
      # not yet migrated their uploads to MinIO.
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ntfy:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_DISABLE_HMR: ${VITE_DISABLE_HMR:-true}
    expose:
      - "8080"
    depends_on:
      - backend
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    healthcheck:
      # Caddy's localhost-only admin endpoint proves its running process is
      # responsive; the scheduled HTTPS watchdog also verifies its public TLS
      # listener and restarts this service if the listener stops responding.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  coturn:
    image: coturn/coturn@sha256:161cedd63c5414c2136f306098e02e9aede74606cedad8b9b8581aae1da4e732
    restart: unless-stopped
    # Host networking is required on Linux so coturn sees real client IPs
    # and UDP relay works without Docker NAT interfering.
    # On macOS/Windows for local dev this is ignored — coturn won't relay
    # but that's fine since both WebRTC peers are on localhost anyway.
    network_mode: host
    environment:
      TURN_USERNAME: ${TURN_USERNAME:?Set TURN_USERNAME in .env}
      TURN_PASSWORD: ${TURN_PASSWORD:?Set TURN_PASSWORD in .env}
      TURN_REALM: ${TURN_REALM:?Set TURN_REALM in .env}
      PUBLIC_IP: ${PUBLIC_IP:-}
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --user=${TURN_USERNAME:?Set TURN_USERNAME in .env}:${TURN_PASSWORD:?Set TURN_PASSWORD in .env}
      - --realm=${TURN_REALM:?Set TURN_REALM in .env}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP}

  livekit:
    image: livekit/livekit-server:v1.8.4
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEYS:-devkey: secret}"

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  ntfy-cache:
  ntfy-auth:
  minio-data:
