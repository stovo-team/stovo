{{- if .Values.uploads.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stovo.fullname" . }}-uploads
  labels:
    {{- include "stovo.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.uploads.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.uploads.persistence.size }}
  {{- with .Values.uploads.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
