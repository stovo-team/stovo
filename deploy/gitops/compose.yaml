# GitOps Compose stack for stage/production Doco-CD deployment
# Image tags must be immutable pinned digests generated by CI release pipeline.
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stovo_default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - stovo_default

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - stovo_default

  orchestrator:
    image: ${ORCHESTRATOR_IMAGE}
    restart: unless-stopped
    environment:
      MASTER_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MASTER_SECRET: ${MASTER_SECRET}
      TENANT_BACKEND_IMAGE: ${TENANT_BACKEND_IMAGE}
      RELEASE_ID: ${RELEASE_ID}
      INTELLIGENCE_INTEGRATION_TENANT_SLUG: ${INTELLIGENCE_INTEGRATION_TENANT_SLUG:-}
      INTELLIGENCE_SOURCE_ENABLED: ${INTELLIGENCE_SOURCE_ENABLED:-false}
      INTELLIGENCE_OIDC_ENABLED: ${INTELLIGENCE_OIDC_ENABLED:-false}
      INTELLIGENCE_OIDC_ISSUER: ${INTELLIGENCE_OIDC_ISSUER:-}
      INTELLIGENCE_OIDC_CLIENT_ID: ${INTELLIGENCE_OIDC_CLIENT_ID:-}
      INTELLIGENCE_OIDC_CLIENT_SECRET: ${INTELLIGENCE_OIDC_CLIENT_SECRET:-}
      INTELLIGENCE_OIDC_REDIRECT_URIS: ${INTELLIGENCE_OIDC_REDIRECT_URIS:-}
      INTELLIGENCE_OIDC_SIGNING_KEY_ID: ${INTELLIGENCE_OIDC_SIGNING_KEY_ID:-}
      INTELLIGENCE_OIDC_SIGNING_PRIVATE_KEY_PEM: ${INTELLIGENCE_OIDC_SIGNING_PRIVATE_KEY_PEM:-}
      INTELLIGENCE_OIDC_PREVIOUS_SIGNING_KEYS_JSON: ${INTELLIGENCE_OIDC_PREVIOUS_SIGNING_KEYS_JSON:-}
      INTELLIGENCE_SOURCE_V2_RESTORE_EPOCH: ${INTELLIGENCE_SOURCE_V2_RESTORE_EPOCH:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
    networks:
      - stovo_default

  rollout-gate:
    image: curlimages/curl:8.10.1
    restart: "no"
    command: >-
      sh -c "
        echo 'Waiting for orchestrator rollout completion...';
        for i in $$(seq 1 60); do
          res=$$(curl -s http://orchestrator:8080/internal/gitops/rollout || true);
          if echo \"$$res\" | grep -q '\"completed\":true'; then
            echo 'Rollout successfully completed: ' \"$$res\";
            exit 0;
          fi;
          if echo \"$$res\" | grep -q '\"phase\":\"failed\"'; then
            echo 'Rollout failed: ' \"$$res\" >&2;
            exit 1;
          fi;
          sleep 5;
        done;
        echo 'Rollout gate timed out after 300s' >&2;
        exit 1;
      "
    depends_on:
      - orchestrator
    networks:
      - stovo_default

networks:
  stovo_default:
    name: stovo_default

volumes:
  postgres-data:
  redis-data:
  minio-data:
