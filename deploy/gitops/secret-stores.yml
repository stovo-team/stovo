# Doco-CD External Secret Store configuration for OCI Vault Webhook Adapter
# Consumed by Doco-CD to resolve deployment secrets from OCI Vault without plaintext secrets in Git.
secret_stores:
  oci-vault:
    provider: webhook
    url: "http://127.0.0.1:8089/v1/secrets/{{ .Release.SecretVersion }}/{{ .Key }}"
    headers:
      Authorization: "Bearer {{ .Env.ADAPTER_AUTH_TOKEN }}"
    jmespath: "value"
