# Blue/green backends share the same build and env. Caddy routes API and
# Socket.IO to ACTIVE_BACKEND (default backend-blue). Local `compose up` starts
# only backend-blue; deploy builds the inactive color (profile bluegreen),
# health-checks it, flips ACTIVE_BACKEND, then stops the old.
# Shared deps (postgres/redis/minio/caddy) stay up across cutovers.
x-backend: &backend
  build:
    context: ./backend
  dns:
    - 77.88.8.8
    - 1.1.1.1
    - 8.8.8.8
  environment:
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.2/32}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    GROQ_BASE_URL: ${GROQ_BASE_URL:-}
    AI_CALL_TRANSCRIPTION_ENABLED: ${AI_CALL_TRANSCRIPTION_ENABLED:-true}
    GROQ_STT_MODEL: ${GROQ_STT_MODEL:-qwen3-asr-flash-2025-09-08}
    GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-}
    GROQ_STT_COST_PER_AUDIO_HOUR_USD: ${GROQ_STT_COST_PER_AUDIO_HOUR_USD:-0.04}
    MINIO_CALLS_BUCKET: ${MINIO_CALLS_BUCKET:-stovo-calls}
    APP_ENV: ${APP_ENV:-production}
    APP_URL: ${APP_URL:-http://localhost:8000}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-capacitor://localhost}
    NATIVE_CLIENT_ORIGINS: ${NATIVE_CLIENT_ORIGINS:-capacitor://localhost}
    API_URL: ${API_URL:-http://localhost:8000}
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://frontend:8080}
    PUBLIC_REACHABILITY_CHECKER_URL: ${PUBLIC_REACHABILITY_CHECKER_URL:-}
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_USER: ${POSTGRES_USER:-family_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:-family_messenger}
    # When set, this takes precedence over the POSTGRES_* values above. It is
    # the connection URL for a managed/external PostgreSQL instance.
    DATABASE_URL: ${DATABASE_URL:-}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    REDIS_URL: ${REDIS_URL:-}
    # Streams are isolated from cache, presence, and socket Pub/Sub state.
    REDIS_JOBS_URL: ${REDIS_JOBS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis-jobs:6379/0}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
    JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
    REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env}
    INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET:?Set INVITE_TOKEN_SECRET in .env}
    REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-family_refresh_token}
    MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:?Set MESSAGE_ENCRYPTION_KEY in .env}
    STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
    LOCAL_STORAGE_PATH: /app/uploads
    # S3-compatible endpoint. Defaults to the bundled MinIO service; set
    # S3_ENDPOINT=s3.cloud.ru and S3_SECURE=true for Cloud.ru Object Storage.
    MINIO_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
    # The private endpoint above is for server I/O. Presigned URLs use this
    # externally reachable Caddy hostname when direct media is enabled.
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
    MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-true}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    MINIO_SECURE: ${S3_SECURE:-false}
    MINIO_FILES_BUCKET: ${MINIO_FILES_BUCKET:-stovo-files}
    MINIO_LOGS_BUCKET: ${MINIO_LOGS_BUCKET:-stovo-logs}
    MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FILE_PATH: /app/logs/backend.log
    LOG_BUFFER_MAX_RECORDS: ${LOG_BUFFER_MAX_RECORDS:-2000}
    TURN_ENABLED: ${TURN_ENABLED:-true}
    TURN_HOST: ${TURN_HOST:-}
    TURN_PORT: ${TURN_PORT:-3478}
    TURN_REALM: ${TURN_REALM:-family-messenger}
    TURN_USERNAME: ${TURN_USERNAME:?Set TURN_USERNAME in .env}
    TURN_PASSWORD: ${TURN_PASSWORD:?Set TURN_PASSWORD in .env}
    NTFY_BASE_URL: ${NTFY_BASE_URL:-http://ntfy:80}
    NTFY_PUBLISH_TOKEN: ${NTFY_PUBLISH_TOKEN:-}
    FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
    FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
  expose:
    - "8000"
  networks:
    default: {}
    member_proxy: {}
  volumes:
    # Local storage remains supported for existing installations that have
    # not yet migrated their uploads to MinIO.
    - ./uploads:/app/uploads
    - ./logs:/app/logs
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  depends_on:
    backend-migrate:
      condition: service_completed_successfully
    redis-jobs:
      condition: service_healthy
    ntfy:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  backend-migrate:
    build:
      context: ./backend
    restart: "no"
    dns:
      - 77.88.8.8
      - 1.1.1.1
      - 8.8.8.8
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-family_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-family_messenger}
      DATABASE_URL: ${DATABASE_URL:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'atlas migrate apply --dir file:///app/migrations --url "$(stovo-database-url)"'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-family_messenger}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles:
      - disabled
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Durable worker stream only. A consumer backlog here cannot evict cache,
  # presence, rate-limit, or socket Pub/Sub data kept in `redis`.
  redis-jobs:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # Streams carry durable worker work. Do not evict a pending job under
    # pressure; PostgreSQL remains the replayable source through outbox_events.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-jobs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ntfy:
    image: binwiederhier/ntfy@sha256:4a7d0f0adc6d5d9fc36e64ab55ef676e76e124a2bdd50ce115b6d9c1c7430294
    command: serve
    volumes:
      - ./deploy/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:80/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    # Console UI is unused in-compose; keep API only. Cap Go heap so MinIO does
    # not treat the host's free RAM as its budget (defaults to ~75% of cgroup).
    command: server /data --address ":9000" --quiet
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER: "off"
      MINIO_MEMLIMIT: ${MINIO_MEMLIMIT:-256MiB}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
    mem_limit: ${MINIO_CONTAINER_MEM_LIMIT:-384m}
    healthcheck:
      # Live probe is cheaper than `mc ready` and does not need an mc alias.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_FILES_BUCKET: ${MINIO_FILES_BUCKET:-stovo-files}
      MINIO_LOGS_BUCKET: ${MINIO_LOGS_BUCKET:-stovo-logs}
      MINIO_CALLS_BUCKET: ${MINIO_CALLS_BUCKET:-stovo-calls}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_FILES_BUCKET && mc mb --ignore-existing local/$$MINIO_LOGS_BUCKET && mc mb --ignore-existing local/$$MINIO_CALLS_BUCKET &&
      mc admin user add local $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY || true &&
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\",\"s3:GetBucketLocation\",\"s3:PutBucketVersioning\"],\"Resource\":[\"arn:aws:s3:::%s\",\"arn:aws:s3:::%s\",\"arn:aws:s3:::%s\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:AbortMultipartUpload\",\"s3:ListMultipartUploadParts\"],\"Resource\":[\"arn:aws:s3:::%s/*\",\"arn:aws:s3:::%s/*\",\"arn:aws:s3:::%s/*\"]}]}' $$MINIO_FILES_BUCKET $$MINIO_LOGS_BUCKET $$MINIO_CALLS_BUCKET $$MINIO_FILES_BUCKET $$MINIO_LOGS_BUCKET $$MINIO_CALLS_BUCKET > /tmp/stovo-backend-policy.json &&
      mc admin policy create local stovo-backend /tmp/stovo-backend-policy.json || true &&
      mc admin policy detach local readwrite --user $$MINIO_ACCESS_KEY || true &&
      mc admin policy attach local stovo-backend --user $$MINIO_ACCESS_KEY &&
      (mc ilm rule add --expire-days 14 local/$$MINIO_LOGS_BUCKET || true)"

  backend-blue:
    <<: *backend
    restart: unless-stopped
    networks:
      default: {}
      member_proxy:
        aliases:
          - backend-blue-proxy

  # Inactive color for zero-downtime deploy cutovers. Opt-in via profile so a
  # plain `docker compose up` only runs backend-blue. Deploy starts it explicitly
  # with `docker compose up -d --no-deps backend-green` (profile bypass).
  backend-green:
    <<: *backend
    restart: unless-stopped
    networks:
      default: {}
      member_proxy:
        aliases:
          - backend-green-proxy
    profiles:
      - bluegreen

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_DISABLE_HMR: ${VITE_DISABLE_HMR:-true}
    expose:
      - "8080"
    depends_on:
      - backend-blue
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 77.88.8.8
    depends_on:
      - frontend
      - backend-blue
    networks:
      default: {}
      member_proxy:
        ipv4_address: 172.30.0.2
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # ACTIVE_BACKEND selects which color Caddy proxies for /api and /socket.io.
      ACTIVE_BACKEND: ${ACTIVE_BACKEND:-backend-blue}
      BACKEND_UPSTREAMS: ${BACKEND_UPSTREAMS:-${ACTIVE_BACKEND:-backend-blue}:8000}
    healthcheck:
      # Caddy's localhost-only admin endpoint proves its running process is
      # responsive; the scheduled HTTPS watchdog also verifies its public TLS
      # listener and restarts this service if the listener stops responding.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  coturn:
    image: coturn/coturn@sha256:161cedd63c5414c2136f306098e02e9aede74606cedad8b9b8581aae1da4e732
    restart: unless-stopped
    # Host networking is required on Linux so coturn sees real client IPs
    # and UDP relay works without Docker NAT interfering.
    # On macOS/Windows for local dev this is ignored — coturn won't relay
    # but that's fine since both WebRTC peers are on localhost anyway.
    network_mode: host
    environment:
      TURN_USERNAME: ${TURN_USERNAME:?Set TURN_USERNAME in .env}
      TURN_PASSWORD: ${TURN_PASSWORD:?Set TURN_PASSWORD in .env}
      TURN_REALM: ${TURN_REALM:?Set TURN_REALM in .env}
      PUBLIC_IP: ${PUBLIC_IP:-}
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --user=${TURN_USERNAME:?Set TURN_USERNAME in .env}:${TURN_PASSWORD:?Set TURN_PASSWORD in .env}
      - --realm=${TURN_REALM:?Set TURN_REALM in .env}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP}

  livekit:
    # v1.9.10 introduced the /rtc/v1 signaling endpoint used by the current
    # browser SDK. Pin a current release rather than relying on the legacy
    # /rtc fallback, which can join but fails during media negotiation.
    image: livekit/livekit-server:v1.12.0
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      # Must match deploy/livekit.yaml's rtc port range. These ports carry
      # WebRTC media once the /rtc signaling connection has been established.
      - "50000-50100:50000-50100/udp"
    environment:
      # The server accepts JWTs only when their issuer and signature match a
      # configured key pair. Render its complete config from the same Compose
      # values supplied to the backend; the old mounted file hard-coded the
      # dev key and rejected production guest tokens with HTTP 401.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
        logging:
          level: info

volumes:
  postgres-data:
  redis-data:
  redis-jobs-data:
  caddy-data:
  caddy-config:
  ntfy-cache:
  ntfy-auth:
  minio-data:

networks:
  member_proxy:
    name: stovo-members-proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
