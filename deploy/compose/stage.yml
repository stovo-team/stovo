# Staging Compose Environment for Stovo (tracks the stage branch).
# Set APP_URL, API_URL, FRONTEND_ORIGIN, and APP_DOMAIN for the stage endpoint.

networks:
  stovo-stage-net:
    driver: bridge
  stage_proxy:
    name: stovo-stage-members-proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/24

services:
  postgres:
    image: postgres:16-alpine
    container_name: stovo-stage-postgres
    restart: unless-stopped
    networks:
      - stovo-stage-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stage .env}
      POSTGRES_DB: ${POSTGRES_DB:-stovo_stage_db}
    expose:
      - "5432"
    volumes:
      - postgres-stage-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stovo-stage-redis
    restart: unless-stopped
    networks:
      - stovo-stage-net
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the stage .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the stage .env}
    expose:
      - "6379"
    volumes:
      - redis-stage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-jobs:
    image: redis:7-alpine
    container_name: stovo-stage-redis-jobs
    restart: unless-stopped
    networks:
      - stovo-stage-net
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the stage .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the stage .env}
    expose:
      - "6379"
    volumes:
      - redis-jobs-stage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: stovo-stage-ntfy
    restart: unless-stopped
    networks:
      - stovo-stage-net
    command: serve
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:80/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: stovo-stage-minio
    restart: unless-stopped
    networks:
      - stovo-stage-net
    command: server /data --address ":9000" --quiet
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the stage .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the stage .env}
      MINIO_BROWSER: "off"
    expose:
      - "9000"
    volumes:
      - minio-stage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: stovo-stage-minio-init
    networks:
      - stovo-stage-net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the stage .env} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the stage .env} &&
      mc mb --ignore-existing local/stovo-files && mc mb --ignore-existing local/stovo-logs && mc mb --ignore-existing local/stovo-calls"

  backend:
    build:
      context: ./backend
    container_name: stovo-stage-backend
    restart: unless-stopped
    networks:
      stovo-stage-net: {}
      stage_proxy:
        aliases:
          - backend-proxy
    environment:
      APP_ENV: staging
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.32.0.2/32}
      APP_URL: ${APP_URL:-http://localhost:8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-capacitor://localhost}
      NATIVE_CLIENT_ORIGINS: ${NATIVE_CLIENT_ORIGINS:-capacitor://localhost}
      API_URL: ${API_URL:-http://localhost:8081}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8081}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stage .env}
      POSTGRES_DB: ${POSTGRES_DB:-stovo_stage_db}
      # The backend builds the direct PostgreSQL URL from POSTGRES_* settings.
      DATABASE_URL_DISABLE_LOCAL_FALLBACK: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the stage .env}
      REDIS_JOBS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the stage .env}@redis-jobs:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the stage .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in the stage .env}
      INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET:?Set INVITE_TOKEN_SECRET in the stage .env}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:?Set MESSAGE_ENCRYPTION_KEY in the stage .env}
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the stage .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the stage .env}
      MINIO_SECURE: "false"
      MINIO_FILES_BUCKET: stovo-files
      MINIO_LOGS_BUCKET: stovo-logs
      MINIO_CALLS_BUCKET: stovo-calls
      NTFY_BASE_URL: http://ntfy:80
      TURN_ENABLED: ${TURN_ENABLED:-false}
      TURN_USERNAME: ${TURN_USERNAME:-stage_turn}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    container_name: stovo-stage-frontend
    restart: unless-stopped
    networks:
      - stovo-stage-net
    depends_on:
      - backend

  caddy:
    image: caddy:alpine
    container_name: stovo-stage-caddy
    restart: unless-stopped
    networks:
      stovo-stage-net: {}
      stage_proxy:
        ipv4_address: 172.32.0.2
    depends_on:
      - frontend
      - backend
    ports:
      # Expose this port through the stage host's configured proxy.
      - "127.0.0.1:8081:8000"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACTIVE_BACKEND: ${ACTIVE_BACKEND:-backend-proxy}
    volumes:
      - ./deploy/caddy/Caddyfile.internal:/etc/caddy/Caddyfile:ro

volumes:
  postgres-stage-data:
  redis-stage-data:
  redis-jobs-stage-data:
  minio-stage-data:
