version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stovo-master-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stovo-master-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: stovo-master-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  orchestrator:
    build:
      context: ./backend
      dockerfile: Dockerfile.orchestrator
    image: stovo-orchestrator:latest
    container_name: stovo-orchestrator
    restart: always
    dns:
      - 77.88.8.8
      - 1.1.1.1
      - 8.8.8.8
    environment:
      MASTER_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Optional external services for tenant backends. DATABASE_URL may use
      # {slug}, for example .../stovo_db_{slug}?sslmode=require.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MASTER_ADMIN_USER: ${MASTER_ADMIN_USER}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD}
      MASTER_SYSTEM_SECRET: ${MASTER_SYSTEM_SECRET}
      PUBLIC_HOST: ${PUBLIC_HOST}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      DOCKER_NETWORK_NAME: stovo_default
      TRUSTED_PROXY_NETWORK_NAME: stovo-master-members-proxy
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: ${GROQ_BASE_URL}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL}
      GROQ_STT_COST_PER_AUDIO_HOUR_USD: ${GROQ_STT_COST_PER_AUDIO_HOUR_USD}
      AI_CALL_TRANSCRIPTION_ENABLED: ${AI_CALL_TRANSCRIPTION_ENABLED}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      TURN_ENABLED: ${TURN_ENABLED}
      TURN_HOST: ${TURN_HOST}
      TURN_PORT: ${TURN_PORT}
      TURN_REALM: ${TURN_REALM}
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stovo-frontend
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: stovo-caddy-gateway
    restart: always
    networks:
      default: {}
      master_proxy:
        ipv4_address: 172.33.0.2
    environment:
      # Supplying a hostname (rather than only :80) lets Caddy obtain a TLS
      # certificate and listen on the published HTTPS port.
      APP_DOMAIN: ${APP_DOMAIN}
      BACKEND_UPSTREAMS: ${BACKEND_UPSTREAMS:-}
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 77.88.8.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - orchestrator
      - frontend

  coturn:
    image: coturn/coturn:4.6.3
    container_name: stovo-coturn
    restart: always
    environment:
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
      TURN_REALM: ${TURN_REALM}
      PUBLIC_IP: ${PUBLIC_IP}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --realm=${TURN_REALM}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP}

  livekit:
    # v1.9.10 introduced the /rtc/v1 signaling endpoint used by the current
    # browser SDK. Pin a current release rather than relying on the legacy
    # /rtc fallback, which can join but fails during media negotiation.
    image: livekit/livekit-server:v1.12.0
    restart: always
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50100:50000-50100/udp"
    environment:
      # Keep the server's accepted JWT key map in lockstep with the
      # credentials injected into every tenant backend by the deploy workflow.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        logging:
          level: info

volumes:
  postgres_data:
  redis_data:
  minio-data:
    external: true
    name: stovo_minio-data
  caddy_data:
  caddy_config:

networks:
  master_proxy:
    name: stovo-master-members-proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/24
