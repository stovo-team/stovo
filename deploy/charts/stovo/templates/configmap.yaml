apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stovo.fullname" . }}-config
  labels:
    {{- include "stovo.labels" . | nindent 4 }}
data:
  APP_NAME: "Stovo"
  APP_URL: {{ .Values.app.url | quote }}
  API_URL: {{ .Values.app.url | quote }}
  FRONTEND_ORIGIN: {{ .Values.app.frontendOrigin | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.app.corsAllowedOrigins | quote }}
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  TURN_ENABLED: {{ .Values.app.turnEnabled | toString | quote }}
  TURN_HOST: {{ .Values.app.turnHost | quote }}
  TURN_PORT: {{ .Values.app.turnPort | quote }}
  LIVEKIT_URL: {{ .Values.app.livekitUrl | quote }}
  NTFY_BASE_URL: {{ .Values.app.ntfyBaseUrl | quote }}
