version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stovo-master-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stovo_master_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stovo-master-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: stovo-master-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stovo_minio_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stovo_minio_pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    image: stovo-orchestrator:latest
    container_name: stovo-orchestrator
    restart: always
    environment:
      MASTER_DB_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-stovo_master_db}?sslmode=disable
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MASTER_ADMIN_USER: ${MASTER_ADMIN_USER:-admin}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD:-changeme_master_pass}
      MASTER_SYSTEM_SECRET: ${MASTER_SYSTEM_SECRET:-super_secret_master_key_123}
      PUBLIC_HOST: ${PUBLIC_HOST:-stovo.local}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-stovo_minio_root}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-stovo_minio_pass}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stovo_minio_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stovo_minio_pass}
      DOCKER_NETWORK_NAME: stovo_default
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stovo-frontend
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: stovo-caddy-gateway
    restart: always
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 77.88.8.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - orchestrator
      - frontend

  coturn:
    image: coturn/coturn:4.6.3
    container_name: stovo-coturn
    restart: always
    environment:
      TURN_USERNAME: ${TURN_USERNAME:-family}
      TURN_PASSWORD: ${TURN_PASSWORD:-change_me}
      TURN_REALM: ${TURN_REALM:-family-messenger}
      PUBLIC_IP: ${PUBLIC_IP:-}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --user=${TURN_USERNAME:-family}:${TURN_PASSWORD:-change_me}
      - --realm=${TURN_REALM:-family-messenger}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP:-}

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
