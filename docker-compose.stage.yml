# Staging Compose Environment for Stovo (tracks the stage branch).
# LXD proxy-2 exposes the Caddy gateway as http://10.29.106.221:9081.

networks:
  stovo-stage-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: stovo-stage-postgres
    restart: unless-stopped
    networks:
      - stovo-stage-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stage_password}
      POSTGRES_DB: ${POSTGRES_DB:-stovo_stage_db}
    expose:
      - "5432"
    volumes:
      - postgres-stage-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stovo-stage-redis
    restart: unless-stopped
    networks:
      - stovo-stage-net
    expose:
      - "6379"
    volumes:
      - redis-stage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-jobs:
    image: redis:7-alpine
    container_name: stovo-stage-redis-jobs
    restart: unless-stopped
    networks:
      - stovo-stage-net
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-jobs-stage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: stovo-stage-ntfy
    restart: unless-stopped
    networks:
      - stovo-stage-net
    command: serve
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:80/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: stovo-stage-minio
    restart: unless-stopped
    networks:
      - stovo-stage-net
    command: server /data --address ":9000" --quiet
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-stovo_stage_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-stovo_stage_pass}
      MINIO_BROWSER: "off"
    expose:
      - "9000"
    volumes:
      - minio-stage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: stovo-stage-minio-init
    networks:
      - stovo-stage-net
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-stovo_stage_root} ${MINIO_ROOT_PASSWORD:-stovo_stage_pass} &&
      mc mb --ignore-existing local/stovo-files && mc mb --ignore-existing local/stovo-logs && mc mb --ignore-existing local/stovo-calls"

  backend:
    build:
      context: ./backend
    container_name: stovo-stage-backend
    restart: unless-stopped
    networks:
      - stovo-stage-net
    environment:
      APP_ENV: staging
      APP_URL: ${APP_URL:-http://10.29.106.221:9081}
      API_URL: ${API_URL:-http://10.29.106.221:9081}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://10.29.106.221:9081}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-stage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stage_password}
      POSTGRES_DB: ${POSTGRES_DB:-stovo_stage_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_JOBS_URL: redis://redis-jobs:6379/0
      JWT_SECRET: stage_secret_jwt_key_12345
      REFRESH_TOKEN_SECRET: stage_refresh_secret_key_12345
      INVITE_TOKEN_SECRET: stage_invite_secret_key_12345
      MESSAGE_ENCRYPTION_KEY: stage_encryption_key_123456789012
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-stovo_stage_root}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-stovo_stage_pass}
      MINIO_SECURE: "false"
      MINIO_FILES_BUCKET: stovo-files
      MINIO_LOGS_BUCKET: stovo-logs
      MINIO_CALLS_BUCKET: stovo-calls
      NTFY_BASE_URL: http://ntfy:80
      TURN_USERNAME: stage_turn
      TURN_PASSWORD: stage_turn_pass
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    container_name: stovo-stage-frontend
    restart: unless-stopped
    networks:
      - stovo-stage-net
    depends_on:
      - backend

  caddy:
    image: caddy:alpine
    container_name: stovo-stage-caddy
    restart: unless-stopped
    networks:
      - stovo-stage-net
    depends_on:
      - frontend
      - backend
    ports:
      # proxy-2 exposes this as http://10.29.106.221:9081.
      - "127.0.0.1:8081:8000"
    environment:
      APP_DOMAIN: 10.29.106.221
      ACTIVE_BACKEND: backend
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro

volumes:
  postgres-stage-data:
  redis-stage-data:
  redis-jobs-stage-data:
  minio-stage-data:
